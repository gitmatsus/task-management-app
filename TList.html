  <style>
    :root {
      --body-from:#f1f5f9; --body-via:#eef2ff; --body-to:#f5f3ff;
      --card:#fff; --card-border:#f3f4f6; --card-shadow:0 20px 25px -5px rgba(99,102,241,.1),0 8px 10px -6px rgba(99,102,241,.05);
      --input-bg:#f9fafb; --input-border:#e5e7eb;
      --t1:#1f2937; --t2:#6b7280; --t3:#9ca3af;
      --filter-bg:#f3f4f6; --filter-hover:rgba(255,255,255,.7);
      --filter-act-from:#fff; --filter-act-to:rgba(238,242,255,.8); --filter-act-text:#4338ca;
      --item-border:#f3f4f6; --item-hover:#f9fafb;
      --divider:#f3f4f6;
      --sidebar-act-bg:rgba(99,102,241,.06); --sidebar-act-text:#4338ca;
      --sidebar-pill-bg:#f3f4f6; --sidebar-pill-text:#9ca3af;
      --sidebar-act-pill-bg:#e0e7ff; --sidebar-act-pill-text:#4338ca;
    }
    html.dark {
      --body-from:#030712; --body-via:#0f172a; --body-to:#1e1b4b;
      --card:#111827; --card-border:#1f2937; --card-shadow:0 20px 25px -5px rgba(0,0,0,.6);
      --input-bg:#1f2937; --input-border:#374151;
      --t1:#f9fafb; --t2:#9ca3af; --t3:#6b7280;
      --filter-bg:#1f2937; --filter-hover:rgba(55,65,81,.7);
      --filter-act-from:rgba(99,102,241,.5); --filter-act-to:rgba(99,102,241,.2); --filter-act-text:#a5b4fc;
      --item-border:#1f2937; --item-hover:rgba(31,41,55,.6);
      --divider:#1f2937;
      --sidebar-act-bg:rgba(99,102,241,.2); --sidebar-act-text:#a5b4fc;
      --sidebar-pill-bg:#374151; --sidebar-pill-text:#6b7280;
      --sidebar-act-pill-bg:rgba(99,102,241,.35); --sidebar-act-pill-text:#a5b4fc;
    }
    html { background:#030712; }
    html:not(.dark) { background:#f1f5f9; }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

    body {
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans',sans-serif;
      background:linear-gradient(135deg,var(--body-from),var(--body-via),var(--body-to));
      min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
      padding:48px 16px 32px; color:var(--t1);
    }
    button { font-family:inherit; }
    .app { width:100%; max-width:58rem; }

    /* ── Header ── */
    .header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:24px; padding:0 4px;
    }
    .header-left { display:flex; align-items:center; gap:10px; }
    .header-icon {
      width:32px; height:32px; border-radius:8px; background:#6366f1; flex-shrink:0;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 10px 15px -3px rgba(99,102,241,.25);
    }
    .header-icon svg { width:16px; height:16px; }
    h1 { font-size:20px; font-weight:700; color:var(--t1); letter-spacing:-.025em; line-height:1.2; }
    .header-sub { font-size:11px; color:var(--t3); }
    .app-version { font-size:11px; color:var(--t3); font-weight:400; margin-left:4px; vertical-align:middle; }
    .header-right { display:flex; align-items:center; gap:8px; }
    .dark-toggle {
      width:36px; height:36px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; border-radius:50%;
      background:var(--card); border:1px solid var(--input-border); cursor:pointer;
      color:var(--t2); transition:all .2s; box-shadow:0 1px 2px rgba(0,0,0,.05);
    }
    html.dark .dark-toggle { color:#fbbf24; }
    .dark-toggle:hover { border-color:#818cf8; }
    .dark-toggle svg { width:16px; height:16px; }

    /* ヘッダー共通アイコンボタン（ベル等） */
    .header-icon-btn {
      position:relative;
      width:36px; height:36px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; border-radius:50%;
      background:var(--card); border:1px solid var(--input-border); cursor:pointer;
      color:var(--t2); transition:all .2s; box-shadow:0 1px 2px rgba(0,0,0,.05);
    }
    .header-icon-btn:hover { border-color:#818cf8; color:#6366f1; }
    .header-icon-btn svg { width:16px; height:16px; }
    .header-icon-btn.has-dot::after {
      content:''; position:absolute; top:6px; right:6px;
      width:8px; height:8px; border-radius:50%; background:#ef4444;
      box-shadow:0 0 0 2px var(--card);
    }

    /* モバイル用サイドバー開閉ボタン */
    .sidebar-toggle-btn {
      display:none;
      width:36px; height:36px; flex-shrink:0; align-items:center; justify-content:center;
      border-radius:50%; background:var(--card); border:1px solid var(--input-border);
      cursor:pointer; color:var(--t2); transition:all .2s; box-shadow:0 1px 2px rgba(0,0,0,.05);
    }
    .sidebar-toggle-btn svg { width:16px; height:16px; }
    .sidebar-toggle-btn.active { background:#6366f1; border-color:#6366f1; color:#fff; }

    /* ── 2-column layout ── */
    .layout { display:flex; gap:16px; align-items:flex-start; }
    .sidebar-col { width:208px; flex-shrink:0; }
    .main-col { flex:1; min-width:0; }

    /* ── Card ── */
    .card {
      background:var(--card); border-radius:16px; box-shadow:var(--card-shadow);
      border:1px solid var(--card-border); overflow:hidden; transition:background .3s,border-color .3s;
    }

    /* ── Sidebar ── */
    .sidebar-hd {
      padding:10px 16px; border-bottom:1px solid var(--divider);
      font-size:10px; font-weight:700; color:var(--t3);
      text-transform:uppercase; letter-spacing:.1em;
      display:flex; align-items:center; justify-content:space-between;
    }
    .stats-toggle {
      width:22px; height:22px; display:flex; align-items:center; justify-content:center;
      border-radius:6px; border:none; background:transparent; color:var(--t3);
      cursor:pointer; transition:all .15s; padding:0;
    }
    .stats-toggle:hover { background:var(--filter-bg); color:var(--t2); }
    .stats-toggle.active { color:#6366f1; }
    html.dark .stats-toggle.active { color:#a5b4fc; }
    .stats-toggle svg { width:12px; height:12px; }
    .list-expand-btn {
      width:100%; display:flex; align-items:center; justify-content:center; gap:4px;
      padding:6px 10px; font-size:11px; font-weight:500; color:var(--t3);
      background:none; border:none; cursor:pointer; border-radius:8px;
      transition:all .15s; font-family:inherit;
    }
    .list-expand-btn:hover { color:#6366f1; background:rgba(99,102,241,.07); }
    html.dark .list-expand-btn:hover { color:#a5b4fc; background:rgba(99,102,241,.15); }
    .list-expand-btn svg { width:12px; height:12px; transition:transform .2s; }
    .list-expand-btn.expanded svg { transform:rotate(180deg); }
    .list-nav { list-style:none; padding:8px; }
    .list-nav-item {
      padding:8px 10px; border-radius:10px; cursor:pointer;
      transition:background .15s; user-select:none;
      display:flex; align-items:center; gap:0;
    }
    .list-content { flex:1; min-width:0; }
    .list-nav-item:hover:not(.active) { background:var(--item-hover); }
    .list-nav-item.active { background:var(--sidebar-act-bg); }
    .list-nav-item.dragging { opacity:.4; }
    .list-nav-item.drag-over { background:rgba(99,102,241,.12); }
    .list-item-row { display:flex; align-items:center; gap:6px; min-width:0; }
    .list-drag-handle {
      display:flex; align-items:center; padding:0 2px 0 0;
      opacity:0; cursor:grab; color:#d1d5db; transition:opacity .15s; flex-shrink:0;
    }
    html.dark .list-drag-handle { color:#374151; }
    .list-nav-item:hover .list-drag-handle { opacity:1; }
    .list-drag-handle:active { cursor:grabbing; }
    .list-drag-handle svg { width:10px; height:10px; }
    .list-type-icon { flex-shrink:0; display:flex; align-items:center; color:var(--t3); }
    .list-type-icon svg { width:12px; height:12px; }
    .list-type-icon.memo-type { color:rgb(245,158,11); }
    .list-nav-item.active .list-type-icon { color:var(--sidebar-act-text); opacity:.7; }
    .list-nav-item.active .list-type-icon.memo-type { color:rgb(245,158,11); opacity:1; }
    .list-item-name {
      flex:1; min-width:0; font-size:14px; font-weight:500; color:var(--t1);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .list-nav-item.active .list-item-name { color:var(--sidebar-act-text); }
    .list-count-pill {
      flex-shrink:0; padding:1px 6px; border-radius:9999px;
      font-size:10px; font-weight:700;
      background:var(--sidebar-pill-bg); color:var(--sidebar-pill-text);
      cursor:default;
    }
    .list-count-pill.sel { background:var(--sidebar-act-pill-bg); color:var(--sidebar-act-pill-text); }
    /* 緊急度カラー: 超過=赤、今日=黄、今週中=緑、来週以降=水色（選択中も上書き） */
    .list-count-pill.urgent-ov, .list-count-pill.urgent-ov.sel { background:#fecaca; color:#b91c1c; }
    html.dark .list-count-pill.urgent-ov, html.dark .list-count-pill.urgent-ov.sel { background:rgba(239,68,68,.4); color:#fca5a5; }
    .list-count-pill.urgent-td, .list-count-pill.urgent-td.sel { background:#fef3c7; color:#b45309; }
    html.dark .list-count-pill.urgent-td, html.dark .list-count-pill.urgent-td.sel { background:rgba(245,158,11,.25); color:#fbbf24; }
    .list-count-pill.urgent-fu, .list-count-pill.urgent-fu.sel { background:#d1fae5; color:#059669; }
    html.dark .list-count-pill.urgent-fu, html.dark .list-count-pill.urgent-fu.sel { background:rgba(16,185,129,.25); color:#34d399; }
    .list-count-pill.urgent-far, .list-count-pill.urgent-far.sel { background:#e0f2fe; color:#0369a1; }
    html.dark .list-count-pill.urgent-far, html.dark .list-count-pill.urgent-far.sel { background:rgba(14,165,233,.22); color:#7dd3fc; }
    .list-del-wrap { flex-shrink:0; position:relative; display:inline-flex; }
    .list-del-btn {
      width:20px; height:20px; display:flex; align-items:center; justify-content:center;
      background:none; border:none; cursor:pointer; border-radius:6px;
      color:#d1d5db; opacity:1; transition:all .15s;
    }
    html.dark .list-del-btn { color:#4b5563; }
    .list-del-btn:hover { color:#f87171; background:rgba(239,68,68,.07); }
    html.dark .list-del-btn:hover { background:rgba(239,68,68,.15); }
    .list-del-btn svg { width:12px; height:12px; }
    .sidebar-dots { display:flex; gap:2px; padding-left:2px; margin-top:4px; }
    .list-add-area { padding:4px 8px 10px; border-top:1px solid var(--divider); margin-top:2px; }
    .list-add-btn {
      width:100%; display:flex; align-items:center; gap:6px; padding:8px 10px; margin-top:4px;
      font-size:12px; font-weight:500; color:var(--t3); background:none; border:none;
      cursor:pointer; border-radius:10px; transition:all .15s;
    }
    .list-add-btn:hover { color:#6366f1; background:rgba(99,102,241,.07); }
    html.dark .list-add-btn:hover { color:#a5b4fc; background:rgba(99,102,241,.15); }
    .list-add-btn svg { width:14px; height:14px; }
    .list-add-form { padding:4px 2px 0; }
    .list-add-input, .list-rename-input {
      width:100%; padding:4px 8px; border-radius:8px; border:1px solid #818cf8;
      background:var(--card); color:var(--t1); font-size:12px; outline:none; font-family:inherit;
    }
    .list-add-input:focus, .list-rename-input:focus { box-shadow:0 0 0 2px rgba(99,102,241,.3); }
    .list-type-toggle {
      display:flex; align-items:center; gap:4px; margin-top:4px; cursor:pointer; font-size:11px; color:var(--t2);
    }
    .list-type-cb {
      width:14px; height:14px; border-radius:3px; border:1.5px solid #d1d5db;
      display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .15s;
    }
    .list-type-cb.checked { background:#6366f1; border-color:#6366f1; }
    .list-type-cb svg { width:10px; height:10px; }

    /* ── List card header ── */
    .list-card-hd {
      padding:14px 20px; border-bottom:1px solid var(--divider);
      display:flex; align-items:center; gap:8px;
    }
    .list-card-icon {
      width:24px; height:24px; border-radius:6px; background:rgba(99,102,241,.85);
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
      box-shadow:0 1px 3px rgba(99,102,241,.3);
    }
    html.dark .list-card-icon { background:rgba(99,102,241,.75); }
    .list-card-icon.memo-icon { background:rgba(245,158,11,.85); box-shadow:0 1px 3px rgba(245,158,11,.3); }
    html.dark .list-card-icon.memo-icon { background:rgba(245,158,11,.75); }
    .list-card-icon svg { width:14px; height:14px; }
    .list-card-name { font-size:15px; font-weight:700; color:var(--t1); }
    .sort-btns {
      margin-left:auto; display:flex; align-items:center; gap:2px;
    }
    .sort-btn {
      border:none; background:transparent; cursor:pointer;
      color:var(--t2); padding:4px 6px; border-radius:6px; display:flex; align-items:center;
      transition:all .2s;
    }
    .sort-btn:hover { background:var(--filter-hover); color:var(--t1); }
    .sort-btn.active { color:#6366f1; background:rgba(99,102,241,.12); }
    html.dark .sort-btn.active { color:#a5b4fc; background:rgba(99,102,241,.2); }
    .sort-btn.action-btn { border:1px solid var(--divider); border-radius:8px; padding:3px 5px; }
    .sort-btn svg { width:18px; height:18px; }

    /* ── Input ── */
    .input-section { padding:20px; border-bottom:1px solid var(--divider); }
    .input-row { display:flex; gap:8px; }
    .todo-input {
      flex:1; padding:10px 16px; border-radius:12px;
      border:1px solid var(--input-border); background:var(--input-bg);
      color:var(--t1); font-size:14px; outline:none; transition:all .2s;
      resize:none; overflow:hidden; min-height:38px; line-height:1.4;
      font-family:inherit; field-sizing:content;
    }
    .todo-input::placeholder { color:var(--t3); }
    .todo-input:focus { border-color:#818cf8; box-shadow:0 0 0 3px rgba(99,102,241,.2); }
    .add-btn {
      padding:10px 20px; background:rgba(99,102,241,.8); color:#fff;
      font-size:14px; font-weight:600; border:none; border-radius:12px; cursor:pointer;
      transition:all .15s; box-shadow:0 1px 2px rgba(99,102,241,.2);
      white-space:nowrap;
    }
    .add-btn:hover { background:rgba(99,102,241,.9); }
    .add-btn:active { transform:scale(.97); }

    /* ── Filters ── */
    .filters-section { padding:16px 20px 4px; }
    .filters { display:flex; background:var(--filter-bg); border-radius:12px; padding:4px; gap:4px; }
    .filter-btn {
      flex:1; padding:6px 4px; font-size:12px; font-weight:600;
      border:none; border-radius:8px; cursor:pointer; background:transparent;
      color:var(--t2); display:flex; flex-direction:column; align-items:center; gap:4px; transition:all .2s;
    }
    .filter-btn:hover:not(.active) { background:var(--filter-hover); color:var(--t1); }
    .filter-btn.active {
      background:linear-gradient(to bottom,var(--filter-act-from),var(--filter-act-to));
      color:var(--filter-act-text); box-shadow:0 1px 3px rgba(0,0,0,.1);
    }
    .filter-btn.drag-over { background:rgba(99,102,241,.15); color:#6366f1; transform:scale(1.05); }
    html.dark .filter-btn.drag-over { background:rgba(99,102,241,.3); color:#a5b4fc; }
    .filter-label { display:flex; align-items:center; gap:6px; }
    .count-pill {
      display:inline-flex; align-items:center; justify-content:center;
      padding:1px 6px; border-radius:9999px; font-size:10px; font-weight:700;
      background:#e5e7eb; color:#9ca3af;
    }
    html.dark .count-pill { background:#374151; color:#6b7280; }
    .filter-btn.active .count-pill { background:#e0e7ff; color:#4338ca; }
    html.dark .filter-btn.active .count-pill { background:rgba(99,102,241,.3); color:#a5b4fc; }
    .filter-btn.active .count-pill.cp-done { background:#f3f4f6; color:#6b7280; }
    html.dark .filter-btn.active .count-pill.cp-done { background:#4b5563; color:#d1d5db; }
    .dot-badges { display:flex; gap:2px; }
    .dot {
      width:16px; height:16px; border-radius:50%; font-size:9px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
      cursor:default; position:relative;
    }
    .dot-ov  { background:#fecaca; color:#b91c1c; }
    .dot-td  { background:#fef3c7; color:#d97706; }
    .dot-fu  { background:#d1fae5; color:#059669; }
    .dot-far { background:#e0f2fe; color:#0369a1; }
    .dot-nd  { background:#e2e8f0; color:#64748b; }
    .dot-dn  { background:#6366f1; color:#fff; }
    html.dark .dot-ov { background:rgba(239,68,68,.4);   color:#fca5a5; }
    html.dark .dot-td { background:rgba(245,158,11,.25);  color:#fbbf24; }
    html.dark .dot-fu { background:rgba(16,185,129,.25);  color:#34d399; }
    html.dark .dot-far{ background:rgba(14,165,233,.22); color:#7dd3fc; }
    html.dark .dot-nd { background:#334155;               color:#94a3b8; }
    html.dark .dot-dn { background:#4f46e5;               color:#fff; }

    /* ── Subtask styles ── */
    .todo-item.is-sub { padding-left:32px; }
    .sub-toggle {
      display:flex; align-items:center; justify-content:center;
      width:18px; flex-shrink:0; padding:0 2px;
      background:none; border:none; cursor:pointer; color:var(--t3);
      transition:color .15s,transform .15s; font-family:inherit;
    }
    .sub-toggle:hover { color:#6366f1; }
    html.dark .sub-toggle:hover { color:#a5b4fc; }
    .sub-toggle svg { width:10px; height:10px; transition:transform .15s; }
    .sub-toggle.expanded svg { transform:rotate(90deg); }
    .collapse-all-btn svg { transition:transform .15s; }
    .collapse-all-btn.expanded svg { transform:rotate(90deg); }
    .sub-toggle-placeholder { width:18px; flex-shrink:0; padding:0 2px; }
    .todo-item.drop-as-sub { box-shadow:inset 0 0 0 2px #6366f1; background:rgba(99,102,241,.06); }
    html.dark .todo-item.drop-as-sub { background:rgba(99,102,241,.15); }
    .due-badge.start-fu { background:#e0f2fe; color:#0369a1; }
    html.dark .due-badge.start-fu { background:rgba(14,165,233,.22); color:#7dd3fc; }
    .due-badge.start-td { background:#fef3c7; color:#d97706; }
    html.dark .due-badge.start-td { background:rgba(245,158,11,.25); color:#fbbf24; }
    .due-badge.start-past,
    .due-badge.recurrence-badge { background:#f1f5f9; color:#64748b; }
    html.dark .due-badge.start-past,
    html.dark .due-badge.recurrence-badge { background:#334155; color:#94a3b8; }
    .edit-recurrence {
      font-size:12px; padding:3px 8px; border-radius:8px;
      border:1px solid var(--input-border); background:var(--card); color:var(--t1);
      cursor:pointer; outline:none; font-family:inherit;
    }
    .edit-recurrence:focus { box-shadow:0 0 0 2px rgba(99,102,241,.3); }
    .completed-time { font-size:10px; color:var(--t3); margin-top:2px; display:block; line-height:1; }
    .text-wrap-inner { display:flex; flex-direction:column; min-width:0; flex:1; }
    .edit-date-label { font-size:10px; color:var(--t3); margin-right:4px; }

    /* ── Todo list ── */
    .todo-list { list-style:none; padding:8px 12px; min-height:96px; }
    .empty-msg { padding:48px 0; text-align:center; color:var(--t3); font-size:14px; user-select:none; }

    /* ── 完了セクション ── */
    .completed-section { border-top:1px solid var(--b1); margin-top:4px; }
    .completed-section-hd {
      width:100%; display:flex; align-items:center; gap:8px;
      padding:10px 20px; background:transparent; border:none; cursor:pointer;
      color:var(--t2); font-size:13px; font-weight:600; text-align:left;
      transition:background .15s;
    }
    .completed-section-hd:hover { background:var(--filter-bg); color:var(--t1); }
    .completed-section-caret { display:inline-flex; width:14px; height:14px; transition:transform .2s; color:var(--t3); }
    .completed-section-caret.open { transform:rotate(90deg); }
    .completed-section-caret svg { width:14px; height:14px; }
    .completed-section-label { flex:1; }
    .completed-list { padding-top:0; }

    /* ── サブ完了トグル（親のサブグループ内） ── */
    .sub-done-header {
      display:flex; align-items:center; gap:6px;
      padding:6px 20px 6px 32px;
      cursor:pointer;
      color:var(--t3);
      font-size:12px;
      font-weight:600;
      background:transparent;
      transition:background .15s;
      list-style:none;
      user-select:none;
      border-bottom:1px solid var(--item-border);
    }
    /* 展開時（直下が完了サブ）と末尾は下線を消す */
    .sub-done-header:has(+ .todo-item.is-sub),
    .sub-done-header:last-child { border-bottom:none; }
    .sub-done-header:hover { background:var(--filter-bg); color:var(--t1); }
    .sub-done-caret { display:inline-flex; width:12px; height:12px; transition:transform .2s; color:var(--t3); }
    .sub-done-caret.open { transform:rotate(90deg); }
    .sub-done-caret svg { width:12px; height:12px; }
    .sub-done-label { flex:1; }
    .todo-item {
      display:flex; align-items:stretch; border-bottom:1px solid var(--item-border);
      border-radius:8px; transition:background .15s,opacity .15s; cursor:text; position:relative;
    }
    .todo-item:last-child { border-bottom:none; }
    /* メインとサブの間、サブとサブの間、サブと完了トグルの間は線を消す */
    .todo-item:has(+ .todo-item.is-sub),
    .todo-item:has(+ .sub-done-header) { border-bottom:none; }
    .todo-item:hover:not(.drag-over) { background:var(--item-hover); }
    .todo-item.drag-over { background:rgba(99,102,241,.07); }
    html.dark .todo-item.drag-over { background:rgba(99,102,241,.15); }
    .todo-item.dragging { opacity:.4; }
    .drag-handle {
      display:flex; align-items:center; padding:0 4px 0 6px;
      opacity:0; cursor:grab; color:#d1d5db; transition:opacity .15s; flex-shrink:0;
    }
    html.dark .drag-handle { color:#374151; }
    .todo-item:hover .drag-handle { opacity:1; }
    .drag-handle:active { cursor:grabbing; }
    .drag-handle svg { width:12px; height:12px; }
    .cb-wrap { display:flex; align-items:center; padding:12px 14px 12px 6px; flex-shrink:0; }
    .memo-item .cb-wrap { display:none; }
    .memo-item .text-wrap { padding-left:6px; }
    .cb {
      width:20px; height:20px; border-radius:50%; border:2px solid #d1d5db;
      background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all .2s; flex-shrink:0;
    }
    html.dark .cb { border-color:#4b5563; }
    .cb:hover { border-color:#9ca3af; }
    html.dark .cb:hover { border-color:#6b7280; }
    .cb { transition:background .2s, border-color .2s, transform .15s; }
    .cb.checked { background:#6366f1; border-color:#6366f1; }
    .cb.checked.animate { animation:cbPop .25s ease; }
    .cb svg { width:12px; height:12px; display:none; }
    .cb.checked svg { display:block; }
    .cb.checked.animate svg { animation:checkIn .2s ease; }
    @keyframes cbPop {
      0%   { transform:scale(1); }
      40%  { transform:scale(1.25); }
      100% { transform:scale(1); }
    }
    @keyframes checkIn {
      0%   { opacity:0; transform:scale(0) rotate(-10deg); }
      60%  { transform:scale(1.2) rotate(5deg); }
      100% { opacity:1; transform:scale(1) rotate(0); }
    }
    .text-wrap { flex:1; min-width:0; padding:12px 12px 12px 0; display:flex; align-items:center; }
    .todo-text { font-size:14px; line-height:1.4; color:var(--t1); }
    .todo-text { transition:color .3s; }
    .todo-text.done {
      text-decoration:none;
      color:#d1d5db;
      background-image:linear-gradient(currentColor, currentColor);
      background-size:100% 1.5px;
      background-repeat:no-repeat;
      background-position:left 55%;
    }
    .todo-text.done.animate {
      background-size:0% 1.5px;
      animation:strikeThrough .35s ease forwards;
    }
    html.dark .todo-text.done { color:#4b5563; }
    @keyframes strikeThrough {
      0%   { background-size:0% 1.5px; }
      100% { background-size:100% 1.5px; }
    }
    .due-wrap { display:flex; align-items:center; padding:12px 4px 12px 0; flex-shrink:0; }
    .due-badge {
      display:inline-flex; align-items:center; gap:4px;
      padding:2px 6px; border-radius:6px; font-size:10px; font-weight:600; white-space:nowrap;
    }
    .due-badge svg { width:10px; height:10px; flex-shrink:0; }
    .due-ov  { background:#fecaca; color:#b91c1c; }
    .due-td  { background:#fef3c7; color:#f59e0b; }
    .due-fu  { background:#d1fae5; color:#10b981; }
    .due-far { background:#e0f2fe; color:#0369a1; }
    html.dark .due-ov  { background:rgba(239,68,68,.4);   color:#fca5a5; }
    html.dark .due-td  { background:rgba(245,158,11,.25); color:#f59e0b; }
    html.dark .due-fu  { background:rgba(16,185,129,.25); color:#10b981; }
    html.dark .due-far { background:rgba(14,165,233,.22); color:#7dd3fc; }
    .item-del { display:flex; align-items:center; padding:12px 8px 12px 0; flex-shrink:0; }
    .item-del button {
      width:28px; height:28px; display:flex; align-items:center; justify-content:center;
      border-radius:8px; border:none; background:transparent; color:#d1d5db; cursor:pointer;
      opacity:0; transition:all .15s;
    }
    html.dark .item-del button { color:#374151; }
    .todo-item:hover .item-del button { opacity:1; }
    .item-del button:hover { color:#f87171; background:rgba(239,68,68,.07); }
    html.dark .item-del button:hover { background:rgba(239,68,68,.15); }
    .item-del svg { width:14px; height:14px; }
    .item-memo { display:flex; align-items:center; padding:12px 0 12px 0; flex-shrink:0; }
    .item-memo button {
      width:28px; height:28px; display:flex; align-items:center; justify-content:center;
      border-radius:8px; border:none; background:transparent; color:#94a3b8; cursor:pointer;
      transition:all .15s;
    }
    .item-memo button:hover { color:#6366f1; background:rgba(99,102,241,.1); }
    .item-memo button.active { color:#6366f1; background:rgba(99,102,241,.1); }
    html.dark .item-memo button { color:#475569; }
    html.dark .item-memo button:hover,
    html.dark .item-memo button.active { color:#a5b4fc; background:rgba(99,102,241,.2); }
    .item-memo svg { width:14px; height:14px; }
    .item-folder { display:flex; align-items:center; padding:12px 2px 12px 0; flex-shrink:0; }
    .item-folder button {
      width:28px; height:28px; display:flex; align-items:center; justify-content:center;
      border-radius:8px; border:none; background:transparent; color:#818cf8; cursor:pointer;
      transition:all .15s;
    }
    .item-folder button:hover { color:#6366f1; background:rgba(99,102,241,.1); }
    html.dark .item-folder button { color:#4f46e5; }
    html.dark .item-folder button:hover { color:#a5b4fc; background:rgba(99,102,241,.2); }
    .item-folder svg { width:14px; height:14px; }

    /* ── Edit form ── */
    .edit-form { width:100%; }
    .edit-text {
      width:100%; padding:4px 8px; border-radius:8px; border:1px solid #818cf8;
      background:var(--card); color:var(--t1); font-size:14px; outline:none; margin-bottom:6px; font-family:inherit;
      resize:none; overflow:hidden; line-height:1.4; field-sizing:content;
    }
    .edit-text:focus { box-shadow:0 0 0 2px rgba(99,102,241,.3); }
    .edit-actions { display:flex; flex-direction:column; gap:6px; }
    .edit-actions-row1 { display:flex; align-items:center; gap:6px; }
    .edit-actions-row2 { display:flex; align-items:center; gap:8px; }
    .edit-date {
      padding:4px 8px; border-radius:8px; border:1px solid var(--input-border);
      background:var(--card); color:var(--t1); font-size:12px; outline:none; font-family:inherit;
    }
    .edit-date:focus { box-shadow:0 0 0 2px rgba(99,102,241,.3); }
    .edit-date-placeholder {
      font-size:12px; color:var(--t3); padding:4px 8px;
      border-radius:8px; border:1px dashed var(--input-border);
      cursor:pointer; user-select:none;
    }
    /* 未選択時はinputを透明化してlabelを重ねる */
    .edit-date-wrap { position:relative; display:inline-flex; cursor:pointer; }
    .edit-date-wrap .edit-date {
      position:absolute; inset:0; opacity:0; width:100%; pointer-events:none;
    }
.edit-clr { font-size:12px; color:var(--t3); background:none; border:none; cursor:pointer; transition:color .15s; display:flex; align-items:center; flex-shrink:0; padding:2px; }
    .edit-clr:hover { color:#f87171; }
    .edit-clr svg { width:12px; height:12px; }
    .edit-save { margin-left:auto; padding:6px 16px; background:#6366f1; color:#fff; font-size:12px; font-weight:500; border:none; border-radius:8px; cursor:pointer; transition:background .15s; font-family:inherit; }
    .edit-save:hover { background:#4f46e5; }
    .edit-cancel { font-size:12px; color:var(--t3); background:none; border:none; cursor:pointer; transition:color .15s; font-family:inherit; }
    .edit-cancel:hover { color:var(--t1); }
    .edit-detail-inp {
      width:100%; padding:6px 8px; border-radius:8px; border:1px solid var(--input-border);
      background:var(--input-bg); color:var(--t2); font-size:13px; outline:none; font-family:inherit;
      resize:none; overflow:hidden; min-height:32px; line-height:1.5; field-sizing:content;
      margin-bottom:2px;
    }
    .edit-detail-inp:focus { box-shadow:0 0 0 2px rgba(99,102,241,.2); border-color:#818cf8; color:var(--t1); }
    .edit-detail-inp::placeholder { color:var(--t3); }
    /* メモポップアップ */
    .memo-popup {
      position:fixed; left:50%; transform:translateX(-50%);
      bottom:72px; z-index:95;
      background:var(--card); border:1px solid var(--card-border);
      border-radius:14px; padding:14px 18px;
      min-width:220px; max-width:min(500px, calc(100vw - 32px));
      max-height:50vh; overflow-y:auto;
      box-shadow:0 12px 40px rgba(0,0,0,.2);
      animation:fadeIn .15s ease;
    }
    html.dark .memo-popup { box-shadow:0 12px 40px rgba(0,0,0,.5); }
    .memo-popup-label {
      font-size:10px; font-weight:700; color:var(--t3);
      text-transform:uppercase; letter-spacing:.1em;
      display:flex; align-items:center; gap:4px; margin-bottom:8px;
    }
    .memo-popup-label svg { width:11px; height:11px; flex-shrink:0; }
    .memo-popup-text {
      font-size:13px; color:var(--t1); line-height:1.7;
      white-space:pre-wrap; word-break:break-word;
    }
    .edit-actions-row3 { display:flex; align-items:center; gap:6px; }
    .edit-link-toggle {
      border:1px solid var(--input-border); background:var(--card); cursor:pointer; color:var(--t2);
      padding:3px 8px; border-radius:6px; display:flex; align-items:center; gap:4px;
      transition:all .2s; flex-shrink:0; font-size:11px; font-family:inherit;
    }
    .edit-link-toggle:hover { color:var(--t1); background:var(--filter-hover); border-color:var(--t2); }
    .edit-link-toggle svg { width:12px; height:12px; }
    .edit-folder-inp {
      flex:1; padding:4px 8px; border-radius:8px; border:1px solid var(--input-border);
      background:var(--card); color:var(--t1); font-size:12px; outline:none; font-family:inherit;
    }
    .edit-folder-inp:focus { box-shadow:0 0 0 2px rgba(99,102,241,.3); border-color:#818cf8; }
    .edit-folder-inp::placeholder { color:var(--t3); }
    .edit-folder-clr { font-size:12px; color:var(--t3); background:none; border:none; cursor:pointer; transition:color .15s; display:flex; align-items:center; flex-shrink:0; }
    .edit-folder-clr:hover { color:#f87171; }
    .edit-folder-clr svg { width:12px; height:12px; }
    /* トースト通知 */
    .toast {
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
      padding:8px 20px; background:#1f2937; color:#fff; border-radius:10px;
      font-size:13px; font-weight:500; z-index:300; pointer-events:none;
      white-space:nowrap; max-width:calc(100vw - 32px); text-align:center;
      box-shadow:0 8px 24px rgba(0,0,0,.25);
      animation:toastIn .2s ease, toastOut .3s ease 2s forwards;
    }
    html.dark .toast { background:#374151; }
    @keyframes toastIn  { from{opacity:0;transform:translateX(-50%) translateY(10px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    @keyframes toastOut { from{opacity:1} to{opacity:0} }

    /* ── Footer ── */
    .footer { padding:14px 20px; border-top:1px solid var(--divider); display:flex; align-items:center; justify-content:space-between; }
    .remaining { font-size:12px; color:var(--t3); }
    .remaining strong { color:#6366f1; font-weight:700; }
    .trash-btn {
      display:flex; align-items:center; gap:6px; padding:6px 12px;
      font-size:12px; font-weight:500; border-radius:8px; cursor:pointer;
      border:1px solid transparent; background:transparent; color:var(--t2); transition:all .15s;
    }
    .trash-btn:hover { background:var(--filter-bg); }
    .trash-btn.open { background:rgba(239,68,68,.07); color:#ef4444; border-color:#fecaca; }
    html.dark .trash-btn.open { background:rgba(239,68,68,.15); border-color:rgba(239,68,68,.4); }
    .trash-btn.drag-over { background:rgba(239,68,68,.12); color:#ef4444; border-color:#fca5a5; transform:scale(1.05); }
    html.dark .trash-btn.drag-over { background:rgba(239,68,68,.25); border-color:rgba(239,68,68,.5); }
    .trash-btn svg { width:14px; height:14px; }
    .trash-cnt {
      background:#fecaca; color:#b91c1c; border-radius:50%;
      width:16px; height:16px; display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:700;
    }
    html.dark .trash-cnt { background:rgba(239,68,68,.4); color:#fca5a5; }

    /* ── Trash panel ── */
    .trash-panel {
      margin-top:12px; background:var(--card); border-radius:16px;
      box-shadow:0 10px 15px -3px rgba(0,0,0,.07); border:1px solid var(--card-border);
      overflow:hidden; transition:background .3s,border-color .3s,box-shadow .2s;
    }
    .trash-panel.drag-over { background:rgba(239,68,68,.05); border-color:#fca5a5; }
    html.dark .trash-panel.drag-over { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.4); }
    .trash-header {
      padding:14px 20px; border-bottom:1px solid var(--divider);
      display:flex; align-items:center; justify-content:space-between;
    }
    .trash-title {
      display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
      color:var(--t2); text-transform:uppercase; letter-spacing:.05em;
    }
    .trash-title svg { width:14px; height:14px; }
    .empty-all {
      font-size:12px; font-weight:500; color:#f87171; background:none; border:none; cursor:pointer;
      padding:4px 10px; border-radius:8px; transition:all .15s; font-family:inherit;
    }
    .empty-all:hover { background:rgba(239,68,68,.07); color:#ef4444; }
    html.dark .empty-all:hover { background:rgba(239,68,68,.15); }
    .trash-list { list-style:none; padding:8px 12px; min-height:48px; }
    .trash-empty { padding:32px 0; text-align:center; color:var(--t3); font-size:14px; user-select:none; }
    .trash-item {
      display:flex; align-items:center; gap:8px; padding:10px 8px;
      border-bottom:1px solid var(--item-border); border-radius:8px;
      transition:background .15s,opacity .15s; cursor:grab;
    }
    .trash-item:last-child { border-bottom:none; }
    .trash-item.is-sub { padding-left:28px; }
    .trash-item:has(+ .trash-item.is-sub) { border-bottom:none; }
    .trash-item:hover { background:var(--item-hover); }
    .trash-item.dragging { opacity:.4; }
    .trash-item-text {
      flex:1; min-width:0; font-size:14px; color:#9ca3af;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .trash-item-text.was-done { text-decoration:line-through; }
    html.dark .trash-item-text { color:#4b5563; }
    .trash-actions { display:flex; align-items:center; gap:4px; opacity:0; flex-shrink:0; transition:opacity .15s; }
    .trash-item:hover .trash-actions { opacity:1; }
    .restore-btn {
      display:flex; align-items:center; gap:4px; padding:4px 8px;
      font-size:12px; font-weight:500; color:#818cf8; background:none; border:none; cursor:pointer;
      border-radius:8px; transition:all .15s; font-family:inherit;
    }
    .restore-btn:hover { color:#6366f1; background:rgba(99,102,241,.07); }
    html.dark .restore-btn:hover { background:rgba(99,102,241,.15); }
    .restore-btn svg { width:12px; height:12px; }
    .tip-wrap { position:relative; display:inline-flex; }
    .del-btn {
      width:24px; height:24px; display:flex; align-items:center; justify-content:center;
      background:none; border:none; cursor:pointer; border-radius:8px; color:#d1d5db; transition:all .15s;
    }
    html.dark .del-btn { color:#374151; }
    .del-btn:hover { color:#f87171; background:rgba(239,68,68,.07); }
    html.dark .del-btn:hover { background:rgba(239,68,68,.15); }
    .del-btn svg { width:14px; height:14px; }
    .tip {
      position:absolute; bottom:100%; left:50%; transform:translateX(-50%);
      margin-bottom:6px; padding:2px 8px; background:#1f2937; color:#fff;
      font-size:10px; font-weight:500; border-radius:6px; white-space:nowrap;
      opacity:0; pointer-events:none; transition:opacity .15s; z-index:10;
    }
    html.dark .tip { background:#374151; }
    .tip-wrap:hover .tip { opacity:1; }
    /* ソートボタン群はカード上端にあり overflow:hidden で隠れるので下に表示 */
    .sort-btns .tip {
      bottom:auto; top:100%; margin-bottom:0; margin-top:6px;
    }

    /* ── Modal overlay ── */
    .modal-overlay {
      position:fixed; inset:0; z-index:100;
      background:rgba(0,0,0,.45);
      display:flex; align-items:center; justify-content:center;
      animation:fadeIn .15s ease;
      padding:16px;
    }
    html.dark .modal-overlay { background:rgba(0,0,0,.65); }
    .modal {
      background:var(--card); border-radius:16px; border:1px solid var(--card-border);
      box-shadow:0 25px 50px -12px rgba(0,0,0,.25);
      width:90%; max-width:420px; max-height:80vh;
      display:flex; flex-direction:column; overflow:hidden;
      animation:modalIn .2s ease;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes modalIn { from{opacity:0;transform:scale(.95) translateY(8px)} to{opacity:1;transform:none} }
    .modal-header {
      padding:16px 20px; border-bottom:1px solid var(--divider);
      display:flex; align-items:center; justify-content:space-between;
    }
    .modal-title { font-size:15px; font-weight:700; color:var(--t1); }
    .modal-close {
      width:28px; height:28px; display:flex; align-items:center; justify-content:center;
      border-radius:8px; border:none; background:transparent; color:var(--t2);
      cursor:pointer; transition:all .15s;
    }
    .modal-close:hover { background:var(--filter-bg); color:var(--t1); }
    .modal-close svg { width:14px; height:14px; }
    .modal-body { padding:12px 20px; overflow-y:auto; flex:1; }
    .modal-check-row {
      display:flex; align-items:center; gap:10px; padding:8px 0;
      border-bottom:1px solid var(--item-border); cursor:pointer; user-select:none;
    }
    .modal-check-row:last-child { border-bottom:none; }
    .modal-check-row.select-all {
      font-weight:700; font-size:13px; color:var(--t2);
      padding-bottom:10px; margin-bottom:4px;
      border-bottom:2px solid var(--divider);
    }
    .modal-cb {
      width:18px; height:18px; border-radius:4px; border:2px solid #d1d5db;
      background:transparent; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; transition:all .15s; cursor:pointer;
    }
    html.dark .modal-cb { border-color:#4b5563; }
    .modal-cb.checked { background:#6366f1; border-color:#6366f1; }
    .modal-cb svg { width:12px; height:12px; display:none; }
    .modal-cb.checked svg { display:block; }
    .modal-list-name {
      flex:1; font-size:14px; color:var(--t1);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .modal-list-count { flex-shrink:0; font-size:11px; color:var(--t3); }
    .modal-footer {
      padding:12px 20px; border-top:1px solid var(--divider);
      display:flex; align-items:center; justify-content:flex-end; gap:8px;
    }
    .modal-btn-cancel {
      padding:8px 16px; font-size:13px; font-weight:500; border-radius:10px;
      border:1px solid var(--input-border); background:var(--card); color:var(--t2);
      cursor:pointer; transition:all .15s; font-family:inherit;
    }
    .modal-btn-cancel:hover { border-color:#818cf8; color:var(--t1); }
    .modal-btn-primary {
      padding:8px 16px; font-size:13px; font-weight:600; border-radius:10px;
      border:none; background:rgba(99,102,241,.8); color:#fff;
      cursor:pointer; transition:all .15s; font-family:inherit;
      box-shadow:0 1px 2px rgba(99,102,241,.2);
    }
    .modal-btn-primary:hover { background:rgba(99,102,241,.9); }
    .modal-btn-primary:disabled { opacity:.4; cursor:not-allowed; }

    /* ── Sidebar IO buttons ── */
    .io-area { padding:8px; border-top:1px solid var(--divider); display:flex; gap:4px; }
    .io-btn {
      flex:1; display:flex; align-items:center; justify-content:center; gap:4px;
      padding:6px 0; font-size:11px; font-weight:500; color:var(--t3);
      background:none; border:none; cursor:pointer; border-radius:8px;
      transition:all .15s; font-family:inherit;
    }
    .io-btn:hover { color:#6366f1; background:rgba(99,102,241,.07); }
    html.dark .io-btn:hover { color:#a5b4fc; background:rgba(99,102,241,.15); }
    .io-btn svg { width:12px; height:12px; }

    /* ── Git sync area ── */
    .git-sync-area {
      padding:4px 8px 8px; display:flex; gap:4px; align-items:center;
      border-top:1px dashed var(--divider);
    }
    .git-sync-status {
      flex:1; font-size:10px; color:var(--t3); display:flex; flex-direction:column; gap:2px;
      overflow:hidden; min-width:0;
    }
    .git-sync-status .git-branch { font-weight:500; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .git-sync-status .git-last { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .git-sync-btn {
      position:relative;
      display:flex; align-items:center; justify-content:center; gap:3px;
      padding:5px 8px; font-size:11px; font-weight:500; color:var(--t2);
      background:rgba(99,102,241,.08); border:1px solid var(--divider);
      border-radius:6px; cursor:pointer; font-family:inherit;
      transition:all .15s;
    }
    .git-sync-btn:hover { background:rgba(99,102,241,.18); color:#6366f1; }
    html.dark .git-sync-btn:hover { color:#a5b4fc; }
    .git-sync-btn:disabled { opacity:.4; cursor:not-allowed; }
    .git-sync-btn svg { width:11px; height:11px; }
    .git-sync-btn .git-cnt {
      position:absolute; top:-5px; right:-5px;
      min-width:14px; height:14px; padding:0 3px;
      border-radius:7px; background:#6366f1; color:#fff;
      font-size:9px; font-weight:700; line-height:14px; text-align:center;
    }
    .git-sync-btn.behind .git-cnt { background:#f59e0b; }
    .git-sync-btn.ahead .git-cnt  { background:#10b981; }
    .git-config-btn {
      display:flex; align-items:center; justify-content:center;
      width:26px; height:26px; padding:0;
      background:none; border:none; color:var(--t3); cursor:pointer;
      border-radius:6px; transition:all .15s;
    }
    .git-config-btn:hover { background:rgba(99,102,241,.1); color:#6366f1; }
    .git-config-btn svg { width:14px; height:14px; }

    /* Git config / merge / error modal の共通スタイル */
    .git-modal-body { padding:14px 20px; font-size:13px; color:var(--t1); display:flex; flex-direction:column; gap:10px; }
    .git-modal-body label.fld { display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--t3); font-weight:500; }
    .git-modal-body label.fld input[type="text"] {
      padding:7px 10px; border-radius:8px; border:1px solid var(--input-border);
      background:var(--input-bg); color:var(--t1); font-family:inherit; font-size:13px;
    }
    .git-modal-body label.row {
      display:flex; align-items:center; gap:8px; font-size:13px; color:var(--t1);
    }
    .git-modal-body label.row input[type="checkbox"] { accent-color:#6366f1; }
    .git-modal-body .git-info-box {
      padding:8px 10px; background:rgba(99,102,241,.07);
      border:1px solid var(--divider); border-radius:8px;
      font-size:12px; color:var(--t2); white-space:pre-wrap; word-break:break-all;
    }
    .git-modal-body .git-info-box.err {
      background:rgba(239,68,68,.07); color:#dc2626; border-color:rgba(239,68,68,.3);
    }
    html.dark .git-modal-body .git-info-box.err { color:#fca5a5; }
    .git-modal-body .git-info-box pre {
      margin:0; font-family:ui-monospace, "Cascadia Code", Consolas, monospace; font-size:11px;
      white-space:pre-wrap; word-break:break-all; max-height:200px; overflow-y:auto;
    }
    .git-test-btn {
      align-self:flex-start;
      padding:5px 10px; border-radius:6px; border:1px solid var(--divider);
      background:none; color:var(--t2); font-size:11px; cursor:pointer; font-family:inherit;
    }
    .git-test-btn:hover { background:rgba(99,102,241,.1); color:#6366f1; }

    /* Merge UI */
    .git-merge-summary { font-size:12px; color:var(--t3); }
    .git-merge-bulk { display:flex; gap:6px; margin-bottom:4px; }
    .git-merge-bulk button {
      padding:4px 10px; border-radius:6px; border:1px solid var(--divider);
      background:none; color:var(--t2); font-size:11px; cursor:pointer; font-family:inherit;
    }
    .git-merge-bulk button:hover { background:rgba(99,102,241,.1); color:#6366f1; }
    .git-merge-list {
      display:flex; flex-direction:column; gap:8px;
      max-height:50vh; overflow-y:auto;
    }
    .git-merge-item {
      border:1px solid var(--divider); border-radius:8px; padding:8px 10px;
      background:var(--input-bg);
    }
    .git-merge-item .git-merge-head {
      font-size:11px; color:var(--t3); font-weight:500; margin-bottom:6px;
    }
    .git-merge-item .git-merge-head .kind-tag {
      display:inline-block; padding:1px 6px; border-radius:4px;
      background:rgba(99,102,241,.15); color:#6366f1; font-size:10px;
      margin-right:6px; font-weight:600;
    }
    .git-merge-options { display:flex; flex-direction:column; gap:4px; }
    .git-merge-option {
      display:flex; align-items:flex-start; gap:6px;
      padding:6px 8px; border-radius:6px; cursor:pointer;
      border:1px solid transparent; background:rgba(0,0,0,.02);
    }
    html.dark .git-merge-option { background:rgba(255,255,255,.03); }
    .git-merge-option:hover { background:rgba(99,102,241,.08); }
    .git-merge-option.selected {
      background:rgba(99,102,241,.12); border-color:rgba(99,102,241,.5);
    }
    .git-merge-option input[type="radio"] { margin-top:2px; accent-color:#6366f1; }
    .git-merge-option .opt-label {
      font-size:10px; color:var(--t3); font-weight:600; margin-bottom:2px;
    }
    .git-merge-option .opt-content { font-size:12px; color:var(--t1); white-space:pre-wrap; word-break:break-word; }
    .git-merge-option .opt-content.deleted { color:#dc2626; font-style:italic; }
    html.dark .git-merge-option .opt-content.deleted { color:#fca5a5; }

    /* ── Task filter chips ── */
    .task-filters {
      display:flex; flex-wrap:wrap; gap:6px;
      padding:8px 16px 4px;
    }
    .task-filter-chip {
      display:inline-flex; align-items:center; gap:4px;
      padding:4px 10px; border-radius:14px;
      background:var(--filter-bg); color:var(--t2);
      border:1px solid var(--divider); cursor:pointer;
      font-size:12px; font-family:inherit;
      transition:background .12s,color .12s,border-color .12s;
    }
    .task-filter-chip:hover { background:var(--filter-hover); color:var(--t1); }
    .task-filter-chip.active {
      background:#6366f1; color:#fff; border-color:#6366f1;
    }
    html.dark .task-filter-chip.active { background:#4f46e5; border-color:#4f46e5; }
    .task-filter-chip .chip-ic { font-size:11px; line-height:1; }
    @media (max-width:640px) {
      .task-filters { padding:6px 12px 2px; gap:4px; }
      .task-filter-chip { padding:3px 8px; font-size:11px; }
    }

    /* ── + Add sub-task button on main rows ── */
    .item-add-sub { display:flex; align-items:center; padding:12px 2px 12px 0; flex-shrink:0; }
    .item-add-sub button {
      display:flex; align-items:center; justify-content:center;
      width:22px; height:22px; padding:0; border:none; border-radius:6px;
      background:transparent; color:var(--t3); cursor:pointer;
      transition:background .12s,color .12s,opacity .12s;
      opacity:0;
    }
    .todo-item:hover .item-add-sub button { opacity:.6; }
    .item-add-sub button:hover { opacity:1 !important; background:rgba(99,102,241,.12); color:#6366f1; }
    html.dark .item-add-sub button:hover { background:rgba(99,102,241,.2); color:#a5b4fc; }
    .item-add-sub svg { width:14px; height:14px; }
    /* タッチ環境ではホバーが無いので常に表示 */
    @media (hover: none) {
      .item-add-sub button { opacity:.7; }
    }

    /* ── Sub-input mode (cancel × button + visual cue) ── */
    .input-row.sub-mode .todo-input {
      background:rgba(99,102,241,.08); border-color:#6366f1;
    }
    html.dark .input-row.sub-mode .todo-input {
      background:rgba(99,102,241,.15); border-color:#a5b4fc;
    }
    .cancel-sub-btn {
      display:flex; align-items:center; justify-content:center;
      width:32px; height:32px; padding:0; border:none; border-radius:8px;
      background:transparent; color:var(--t3); cursor:pointer;
      transition:background .12s,color .12s;
    }
    .cancel-sub-btn:hover { background:rgba(220,38,38,.1); color:#dc2626; }
    html.dark .cancel-sub-btn:hover { background:rgba(248,113,113,.15); color:#f87171; }
    .cancel-sub-btn svg { width:14px; height:14px; }

    /* ── Context menu (right-click) ── */
    .ctx-menu-overlay {
      position:fixed; inset:0; z-index:150; background:transparent;
    }
    .ctx-menu {
      position:fixed; background:var(--card); border:1px solid var(--card-border);
      border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.18);
      list-style:none; padding:4px; margin:0; min-width:140px;
      font-size:13px; user-select:none; animation:fadeIn .12s ease;
    }
    .ctx-menu-item {
      display:flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:6px; cursor:pointer;
      color:var(--t1); transition:background .12s;
    }
    .ctx-menu-item:hover { background:var(--item-hover); }
    .ctx-menu-item svg { width:14px; height:14px; flex-shrink:0; }
    .ctx-menu-danger { color:#dc2626; }
    html.dark .ctx-menu-danger { color:#f87171; }
    .ctx-menu-danger:hover { background:rgba(220,38,38,.1); }
    html.dark .ctx-menu-danger:hover { background:rgba(248,113,113,.15); }

    /* サブメニュー（サブに登録）の表示 */
    .ctx-has-sub { position:relative; padding-right:24px; }
    .ctx-arrow { margin-left:auto; font-size:10px; color:var(--t3); }
    .ctx-submenu {
      position:absolute; left:100%; top:-4px; min-width:180px;
      background:var(--card); border:1px solid var(--card-border);
      border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.18);
      list-style:none; padding:4px; margin:0;
      display:none; max-height:240px; overflow-y:auto;
    }
    .ctx-has-sub:hover > .ctx-submenu,
    .ctx-has-sub.open > .ctx-submenu { display:block; }
    .ctx-submenu .ctx-menu-item {
      font-size:12px; padding:6px 10px;
    }
    @media (max-width:640px) {
      .ctx-submenu { left:0; top:100%; }
    }

    /* ── Move-to-list popup ── */
    .move-popup-overlay {
      position:fixed; inset:0; z-index:100;
      background:rgba(0,0,0,.45);
      display:flex; align-items:flex-end; justify-content:center;
      animation:fadeIn .15s ease;
      padding:0;
    }
    html.dark .move-popup-overlay { background:rgba(0,0,0,.65); }
    .move-popup {
      background:var(--card); border-radius:16px 16px 0 0; border:1px solid var(--card-border);
      border-bottom:none;
      box-shadow:0 -10px 40px rgba(0,0,0,.15);
      width:100%; max-width:500px;
      animation:movePopupIn .2s ease;
      padding-bottom:env(safe-area-inset-bottom);
    }
    @keyframes movePopupIn { from{transform:translateY(100%)} to{transform:translateY(0)} }
    .move-popup-header {
      padding:16px 20px 8px; display:flex; align-items:center; justify-content:space-between;
    }
    .move-popup-title { font-size:14px; font-weight:700; color:var(--t1); }
    .move-popup-task { padding:0 20px 12px; font-size:12px; color:var(--t3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .move-popup-list {
      list-style:none; padding:0 8px 8px; max-height:50vh; overflow-y:auto;
    }
    .move-popup-item {
      display:flex; align-items:center; gap:10px; padding:12px;
      border-radius:10px; cursor:pointer; transition:background .15s; user-select:none;
    }
    .move-popup-item:hover { background:var(--item-hover); }
    .move-popup-item:active { background:rgba(99,102,241,.1); }
    .move-popup-item-name { flex:1; font-size:14px; font-weight:500; color:var(--t1); }
    .move-popup-item-count { font-size:11px; color:var(--t3); }
    .move-popup-item-icon { color:#6366f1; flex-shrink:0; }
    .move-popup-item-icon svg { width:16px; height:16px; }

    /* ── File drop zone overlay ── */
    .drop-zone-overlay {
      position:fixed; inset:0; z-index:200;
      background:rgba(99,102,241,.08);
      border:3px dashed #6366f1;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none;
    }
    html.dark .drop-zone-overlay { background:rgba(99,102,241,.15); border-color:#818cf8; }
    .drop-zone-text {
      padding:16px 32px; border-radius:16px;
      background:var(--card); border:1px solid var(--card-border);
      box-shadow:0 10px 25px rgba(0,0,0,.15);
      font-size:16px; font-weight:700; color:#6366f1;
    }
    html.dark .drop-zone-text { color:#a5b4fc; }

    /* ── Sidebar list trash ── */
    .sidebar-trash-section { border-top:1px solid var(--divider); }
    .sidebar-trash-hd {
      padding:8px 16px 4px; display:flex; align-items:center; justify-content:space-between;
    }
    .sidebar-trash-title {
      font-size:10px; font-weight:700; color:var(--t3);
      text-transform:uppercase; letter-spacing:.1em;
      display:flex; align-items:center; gap:4px;
    }
    .sidebar-trash-toggle { padding:4px 8px; border-top:1px solid var(--divider); }
    .sidebar-trash-toggle .list-add-btn { margin-top:0; }
    .sidebar-trash-toggle .list-add-btn.open { background:rgba(239,68,68,.07); color:#ef4444; }
    html.dark .sidebar-trash-toggle .list-add-btn.open { background:rgba(239,68,68,.15); color:#ef4444; }
    .list-trash-item { padding:6px 10px; }
    .list-trash-item .list-item-name { color:var(--t3); }
    .list-trash-actions { display:flex; gap:2px; flex-shrink:0; }
    .list-trash-actions .list-del-btn { opacity:1; }
    .list-trash-actions .list-del-btn.restore-color { color:#818cf8; }
    .sidebar-trash-empty { padding:16px 0; font-size:12px; }
    .sidebar-trash-list { padding:4px 8px; }
    .empty-all-sm { font-size:10px; padding:2px 6px; }
    .trash-cnt-sm { width:14px; height:14px; font-size:9px; }

    /* ── モバイル用 固定入力バー ── */
    .input-bar-mobile {
      display:none;
      position:fixed; bottom:0; left:0; right:0; z-index:90;
      background:var(--card);
      border-top:1px solid var(--card-border);
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 -8px 24px rgba(0,0,0,.06);
    }
    html.dark .input-bar-mobile {
      box-shadow:0 -8px 24px rgba(0,0,0,.3);
    }
    .input-bar-mobile .input-row { display:flex; gap:8px; }
    .input-bar-mobile .todo-input { flex:1; font-size:16px; padding:10px 12px; }
    .input-bar-mobile .add-btn { flex-shrink:0; padding:10px 16px; font-size:14px; }

    /* ══════════════════════════════════════════
       モバイル対応 (max-width: 640px)
    ══════════════════════════════════════════ */
    @media (max-width: 640px), (max-width: 1024px) and (pointer: coarse) {
      /* 長押しコンテキストメニュー・テキスト選択を抑制
         アプリ全体に適用しないと、メニュー操作で画面が切り替わった後に
         別の要素上でテキスト選択ハイライトが残る現象が起きる */
      body, body * {
        -webkit-touch-callout:none;
        -webkit-user-select:none;
        user-select:none;
        -webkit-tap-highlight-color:transparent;
      }
      /* ただし入力要素・編集可能要素・メモ表示テキストは通常通り選択・コピー可能 */
      input, textarea, select,
      [contenteditable="true"],
      .memo-popup-text, .memo-popup-text * {
        -webkit-user-select:text;
        user-select:text;
        -webkit-touch-callout:default;
      }

      body {
        padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 32px calc(12px + env(safe-area-inset-left));
        align-items:flex-start;
      }

      .app { max-width:100%; }

      /* ヘッダー */
      .header { margin-bottom:12px; }
      h1 { font-size:17px; }
      .sidebar-toggle-btn { display:flex; }

      /* レイアウト：縦積みに変更 */
      .layout { flex-direction:column; gap:12px; }
      .sidebar-col { width:100%; }

<script>
// ── App Version ────────────────────────────────────────
const APP_VERSION = '1.1.0';

// ── State ──────────────────────────────────────────────
let todos = [], trash = [], lists = [], selectedListId = '';
let showTrash = false;

let editId = null, editText = '', editDue = '', editFolderPath = '', editDetail = '', editLinkType = 'folder', editRecurrence = {}, skipFocusRestore = false;

let editStartDate = '';
let collapsedIds = new Set(); // セッション単位の折りたたみ状態（永続化しない）

// ── 通知（バッジ）設定 ─────────────────────────────────
let notifyPermissionCache = null; // 'default' | 'granted' | 'denied' | 'unsupported'

function getNotifyPermission() {
  if (!('Notification' in window)) return 'unsupported';
  return Notification.permission; // 'default' | 'granted' | 'denied'
}
function isIOSSafari() {
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  // iPad の Safari は Mac と区別しづらいので touch + Safari で判定
  const isIPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
  const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  return (isIOS || isIPadOS) && isSafari;
}
function isStandalonePWA() {
  // ホーム画面追加されたかどうか（iOS Safari / Chromium 両対応）
  if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
  if (window.navigator.standalone === true) return true;
  return false;
}
async function requestNotifyPermission() {
  if (!('Notification' in window)) return 'unsupported';
  const p = Notification.permission;
  if (p === 'granted' || p === 'denied') return p;
  try {
    // 一部ブラウザはコールバック型しか対応していないので両対応
    const result = await new Promise((resolve) => {
      const ret = Notification.requestPermission((r) => resolve(r));
      if (ret && typeof ret.then === 'function') ret.then(resolve);
    });
    return result;
  } catch {
    return 'denied';
  }
}

// ── Persistence ────────────────────────────────────────
// 共通の data 整合性修復処理（load 後と Git マージ反映後の両方で使う）
function repairAfterLoad() {
  if (!lists.length) {
    lists = [{ id: crypto.randomUUID(), name: 'マイタスク', createdAt: Date.now() }];
  }
  const defId = lists[0].id;
  todos = todos.map(t => t.listId ? t : { ...t, listId: defId });
  trash = trash.map(t => t.listId ? t : { ...t, listId: defId });
  // 孤児サブの修復: 親が存在しない／親が別リストにある／親自身がサブ の場合は parentId をクリア
  todos.forEach(t => {
    if (!t.parentId) return;
    const p = todos.find(x => x.id === t.parentId);
    if (!p || p.listId !== t.listId || p.parentId) {
      t.parentId = undefined;
    }
  });
  // id 重複排除（先勝ち）
  {
    const seen = new Set();
    todos = todos.filter(t => seen.has(t.id) ? false : (seen.add(t.id), true));
  }
  // 旧形式の繰り返しフィールド（文字列）はクリア
  todos.forEach(t => {
    if (t.recurrence && typeof t.recurrence !== 'object') t.recurrence = undefined;
  });
  // 親不在の paired サブをゴミ箱から除去
  {
    const trashIds = new Set(trash.map(t => t.id));
    trash = trash.filter(t => {
      if (!t._trashedWithParent) return true;
      return trashIds.has(t._trashedWithParent);
    });
  }
}

function load() {
  try { lists = JSON.parse(localStorage.getItem('todo-app-lists') || '[]'); } catch { lists = []; }
  try { todos = JSON.parse(localStorage.getItem('todo-app-todos') || '[]'); } catch { todos = []; }
  try { trash = JSON.parse(localStorage.getItem('todo-app-trash') || '[]'); } catch { trash = []; }
  try { listTrash = JSON.parse(localStorage.getItem('todo-app-list-trash') || '[]'); } catch { listTrash = []; }
  repairAfterLoad();
  // 全データ読み込み後に選択リストを復元
  const savedListId = localStorage.getItem('todo-app-selected-list');
  selectedListId = (savedListId && lists.find(l => l.id === savedListId))
    ? savedListId : lists[0].id;
  // UI 状態の復元（折りたたみ・展開状態・フィルター等）
  try {
    const s = JSON.parse(localStorage.getItem('todo-app-ui-state') || '{}');
    if (Array.isArray(s.collapsedIds))      collapsedIds      = new Set(s.collapsedIds);
    if (Array.isArray(s.expandedDoneSubs))  expandedDoneSubs  = new Set(s.expandedDoneSubs);
    if (typeof s.showCompletedSection === 'boolean') showCompletedSection = s.showCompletedSection;
    if (typeof s.listExpanded         === 'boolean') listExpanded         = s.listExpanded;
    if (typeof s.taskFilter           === 'string')  taskFilter           = s.taskFilter;
  } catch { /* ignore */ }
}
function save() {
  localStorage.setItem('todo-app-todos',  JSON.stringify(todos));
  localStorage.setItem('todo-app-trash',  JSON.stringify(trash));
  localStorage.setItem('todo-app-lists',  JSON.stringify(lists));
  localStorage.setItem('todo-app-list-trash', JSON.stringify(listTrash));
  localStorage.setItem('todo-app-selected-list', selectedListId);
}
// UI 表示状態（展開・折りたたみ・フィルター等）の永続化
function saveUiState() {
  try {
    localStorage.setItem('todo-app-ui-state', JSON.stringify({
      collapsedIds:        [...collapsedIds],
      expandedDoneSubs:    [...expandedDoneSubs],
      showCompletedSection,
      listExpanded,
      taskFilter,
    }));
  } catch { /* ignore (容量超過等) */ }
}

// ── Helpers ────────────────────────────────────────────
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today    = () => ymd(new Date());
const tomorrow = () => ymd(new Date(Date.now() + 86400000));
const WEEKDAY_LABELS = ['日','月','火','水','木','金','土'];

// ── 繰り返し関連ヘルパー ─────────────────────────────────
function addDaysYmd(yyyymmdd, n) {
  const [y, m, d] = yyyymmdd.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setDate(date.getDate() + n);
  return ymd(date);
}
// 指定の年月（1-12）と日（1-31 or 'last'）から YMD 文字列を作る。
// 月オーバーフローは年に繰り上げ、'last' および月末超過は当月末に丸める。
function monthlyDateFor(year, month, day) {
  let y = year, m = month;
  while (m > 12) { y += 1; m -= 12; }
  while (m < 1)  { y -= 1; m += 12; }
  const lastDay = new Date(y, m, 0).getDate();
  const d = (day === 'last' || day > lastDay) ? lastDay : day;
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
// 繰り返し設定から「今日以降の最初の発生日」を返す
function computeFirstDueDate(recurrence, now) {
  now = now || new Date();
  const todayStr = ymd(now);
  if (recurrence.type === 'daily')  return todayStr;
  if (recurrence.type === 'weekly') {
    const diff = ((recurrence.weekday ?? 1) - now.getDay() + 7) % 7;
    return addDaysYmd(todayStr, diff);
  }
  if (recurrence.type === 'monthly') {
    const thisMonth = monthlyDateFor(now.getFullYear(), now.getMonth() + 1, recurrence.day);
    if (thisMonth >= todayStr) return thisMonth;
    return monthlyDateFor(now.getFullYear(), now.getMonth() + 2, recurrence.day);
  }
  return todayStr;
}
// 既存の dueDate から「次の発生日（今日以降まで進める）」を返す
function advanceRecurrenceDate(recurrence, fromYmd, now) {
  now = now || new Date();
  const todayStr = ymd(now);
  let d = fromYmd;
  let safety = 1000;
  do {
    if (recurrence.type === 'daily')       d = addDaysYmd(d, 1);
    else if (recurrence.type === 'weekly') d = addDaysYmd(d, 7);
    else if (recurrence.type === 'monthly') {
      const [y, m] = d.split('-').map(Number);
      d = monthlyDateFor(y, m + 1, recurrence.day);
    } else break;
    if (--safety <= 0) break;
  } while (d < todayStr);
  return d;
}
function isoWeekKey(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return `${d.getUTCFullYear()}-W${String(weekNum).padStart(2,'0')}`;
}
function getPeriodKey(date, recurrence) {
  if (recurrence.type === 'daily')   return ymd(date);
  if (recurrence.type === 'monthly') return ymd(date).slice(0, 7);
  if (recurrence.type === 'weekly')  return isoWeekKey(date);
  return null;
}
// 繰り返しタスクの周期境界をまたいだものを未完了に戻し、dueDate を次回発生日に進める
function applyRecurringResets() {
  const now = new Date();
  let changed = false;
  todos.forEach(t => {
    if (!t.recurrence?.type || !t.completed || !t.completedAt) return;
    const cKey = getPeriodKey(new Date(t.completedAt), t.recurrence);
    const nKey = getPeriodKey(now, t.recurrence);
    if (cKey && nKey && cKey !== nKey) {
      t.completed = false;
      t.completedAt = undefined;
      if (t.dueDate) t.dueDate = advanceRecurrenceDate(t.recurrence, t.dueDate, now);
      changed = true;
    }
  });
  if (changed) save();
  return changed;
}
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function isMobile() {
  return window.innerWidth <= 640 ||
    ('ontouchstart' in window && window.innerWidth <= 1024);
}

function currentTodos() { return todos.filter(x => x.listId === selectedListId); }
function currentTrash() { return trash.filter(x => x.listId === selectedListId); }

function listStats(lid) {
  const t = today();
  const weekEnd = endOfWeekYmd();
  const lst = todos.filter(x => x.listId === lid);
  const active = lst.filter(x => !x.completed);
  return {
    total:    lst.length,
    active:   active.length,
    done:     lst.length - active.length,
    overdue:  active.filter(x => x.dueDate && x.dueDate < t).length,
    dueToday: active.filter(x => x.dueDate === t).length,
    dueWeek:  active.filter(x => x.dueDate && x.dueDate > t && x.dueDate <= weekEnd).length,
    weekPlus: active.filter(x => x.dueDate && x.dueDate > weekEnd).length,
    noDate:   active.filter(x => !x.dueDate).length,
  };
}

// ── Taskbar Badge ─────────────────────────────────────
// 全 todo リスト（メモ除く）の「超過 + 今日が期限」の合計を返す
// バッジに載せる数 = 緊急度高（赤＋橙）に該当する未完了タスク数
function computeBadgeCount() {
  let n = 0;
  for (const l of lists) {
    if (l.type === 'memo') continue;
    const s = listStats(l.id);
    n += s.overdue + s.dueToday;
  }
  return n;
}

// 環境に応じてタスクバー/Dock バッジを更新
// - Tauri: invoke('set_taskbar_badge', { count }) で Windows タスクバーオーバーレイを更新
// - PWA (Chrome/Edge にインストール時): navigator.setAppBadge
// - ブラウザのみ: 何もしない（document.title に件数だけ反映）
let _lastBadgeCount = -1;
async function updateBadge(n) {
  if (n === _lastBadgeCount) return;  // 変化がないときはスキップ（無駄な native 呼び出しを避ける）
  _lastBadgeCount = n;

  // タイトルにも反映（タスクバー hover で件数が見える）
  document.title = n > 0 ? `(${n}) TList` : 'TList';

  // PWA Badging API
  if ('setAppBadge' in navigator) {
    try {
      if (n > 0) await navigator.setAppBadge(n);
      else await navigator.clearAppBadge();
    } catch (_) { /* ignore */ }
  }

  // Tauri: Windows タスクバーアイコンのオーバーレイバッジ
  if (window.__TAURI__?.core?.invoke) {
    try { await window.__TAURI__.core.invoke('set_taskbar_badge', { count: n }); }
    catch (_) { /* ignore */ }
  }
}
function subTodosOf(parentId) { return todos.filter(x => x.parentId === parentId); }
function hasSubs(id) { return todos.some(x => x.parentId === id); }
function isSubTask(t) { return !!t?.parentId; }
function getParent(t) { return t?.parentId ? todos.find(x => x.id === t.parentId) : null; }

// メインタスクの完了状態でグループを2つに分ける（active / completed）
// - メインが未完了のグループ（メイン+サブ全て）→ active
// - メインが完了のグループ（メイン+サブ全て）→ completed
// - 親のいない孤児サブは自身の完了状態で振り分け
function splitGroupsByCompletion() {
  const lst = currentTodos();
  const activeMainIds = new Set();
  const completedMainIds = new Set();
  lst.forEach(t => {
    if (!t.parentId) {
      // 親が完了でも未完了サブが残っていれば active グループに留める
      const hasIncompleteSubs = lst.some(s => s.parentId === t.id && !s.completed);
      if (t.completed && !hasIncompleteSubs) {
        completedMainIds.add(t.id);
      } else {
        activeMainIds.add(t.id);
      }
    }
  });
  const active = [];
  const completed = [];
  lst.forEach(t => {
    if (!t.parentId) {
      if (activeMainIds.has(t.id)) active.push(t);
      else if (completedMainIds.has(t.id)) completed.push(t);
    } else if (activeMainIds.has(t.parentId)) {
      active.push(t);
    } else if (completedMainIds.has(t.parentId)) {
      completed.push(t);
    } else {
      // 孤児サブ
      (t.completed ? completed : active).push(t);
    }
  });
  return { active, completed };
}

// ── タスクフィルター判定 ──
function endOfWeekYmd() {
  // 今日から 6日後（今日含めて7日）
  return ymd(new Date(Date.now() + 6 * 86400000));
}
function matchFilter(t) {
  if (taskFilter === 'all') return true;
  // 完了済みタスクはフィルター対象外（既に対応済み）
  if (t.completed) return false;
  const td = today();
  if (taskFilter === 'week') {
    if (!t.dueDate) return false;
    return t.dueDate <= endOfWeekYmd(); // 超過分も含む
  }
  if (taskFilter === 'actionable') {
    return !t.startDate || t.startDate <= td;
  }
  if (taskFilter === 'overdue') {
    return !!t.dueDate && t.dueDate < td;
  }
  if (taskFilter === 'today') {
    return t.dueDate === td;
  }
  return true;
}
// グループ単位でフィルター: メインかサブのいずれかが条件一致ならグループ全体を残す
function applyTaskFilter(list) {
  if (taskFilter === 'all') return list;
  const cur = currentTodos();
  const keepMainIds = new Set();
  // メインのマッチ
  cur.forEach(t => { if (!t.parentId && matchFilter(t)) keepMainIds.add(t.id); });
  // サブがマッチしたら親メインも残す
  cur.forEach(t => {
    if (t.parentId && matchFilter(t)) {
      const p = cur.find(x => x.id === t.parentId && !x.parentId);
      if (p) keepMainIds.add(p.id);
    }
  });
  // フィルター中は完了済みタスクを非表示にする（メイン/サブ問わず）
  // サブは「親が残る」だけでなく「サブ自身もマッチする」ことを必須にする
  return list.filter(t => {
    if (t.completed) return false;
    if (!t.parentId) return keepMainIds.has(t.id);
    return keepMainIds.has(t.parentId) && matchFilter(t);
  });
}

// 描画用：表示順を「メイン→そのサブ群」と並べる
// active セクション内では「未完了サブ → 完了トグル → 完了サブ（展開時のみ）」の順
function arrangeForRender(visibleList) {
  const visibleIds = new Set(visibleList.map(x => x.id));
  const cur = currentTodos();
  const result = [];
  // メインタスクを元順で走査
  cur.forEach(t => {
    if (t.parentId) return;
    if (!visibleIds.has(t.id)) return;
    result.push(t);
    if (collapsedIds.has(t.id)) return;
    // この親の可視サブを元順で抽出
    const visibleSubs = [];
    cur.forEach(s => {
      if (s.parentId === t.id && visibleIds.has(s.id)) visibleSubs.push(s);
    });
    // 完了セクション側（親完了 AND 全サブ完了）はそのまま並べる
    const isActiveContext = !t.completed || visibleSubs.some(s => !s.completed);
    if (!isActiveContext) {
      visibleSubs.forEach(s => result.push(s));
    } else {
      // 未完了サブを先に、完了サブはトグルの下にまとめる
      const activeSubs = visibleSubs.filter(s => !s.completed);
      const doneSubs   = visibleSubs.filter(s => s.completed);
      activeSubs.forEach(s => result.push(s));
      if (doneSubs.length > 0) {
        const expanded = expandedDoneSubs.has(t.id);
        result.push({ _doneSubsHeader: true, parentId: t.id, doneCount: doneSubs.length, expanded });
        if (expanded) doneSubs.forEach(s => result.push(s));
      }
    }
  });
  // 親が現在リストに存在しない孤児サブ（保険）
  cur.forEach(t => {
    if (t.parentId && !cur.find(p => p.id === t.parentId && !p.parentId) && visibleIds.has(t.id)) {
      result.push(t);
    }
  });
  return result;
}

// ── Due badge HTML ─────────────────────────────────────
function dueBadge(d) {
  const t = today(), tm = tomorrow(), we = endOfWeekYmd();
  const ov = d < t, td = d === t, tmr = d === tm, far = d > we;
  const lbl = td ? '今日' : tmr ? '明日' : d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$2/$3');
  const cls = ov ? 'due-ov' : td ? 'due-td' : far ? 'due-far' : 'due-fu';
  return `<span class="due-badge ${cls}">${I.cal}${ov ? `超過 (${lbl})` : lbl}</span>`;
}
function startBadge(d) {
  const t = today(), tm = tomorrow();
  const past = d < t, td = d === t, tmr = d === tm;
  const lbl = td ? '今日' : tmr ? '明日' : d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$2/$3');
  const cls = past ? 'start-past' : td ? 'start-td' : 'start-fu';
  return `<span class="due-badge ${cls}">${I.play}${lbl}</span>`;
}
function sameDayBadge(d) {
  // 開始日と終了日が同じ日の場合の統合バッジ（▶📅 両方のアイコン表示）
  const t = today(), tm = tomorrow(), we = endOfWeekYmd();
  const ov = d < t, td = d === t, tmr = d === tm, far = d > we;
  const lbl = td ? '今日' : tmr ? '明日' : d.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$2/$3');
  const cls = ov ? 'due-ov' : td ? 'due-td' : far ? 'due-far' : 'due-fu';
  return `<span class="due-badge ${cls}">${I.play}${I.cal}${ov ? `超過 (${lbl})` : lbl}</span>`;
}

// ── Git 同期エリア（サイドバー）──────────────────────────
function htmlGitSyncArea() {
  if (!isTauriEnv()) return '';
  const cfg = getGitConfig();
  if (!cfg.enabled) {
    // 未設定時は設定ボタンのみ
    return `<div class="git-sync-area" title="Git 同期">
      <div class="git-sync-status">
        <span class="git-branch">Git 同期: 未設定</span>
      </div>
      <button class="git-config-btn" data-a="open-git-config" title="設定">${I.git}</button>
    </div>`;
  }
  const st = gitStatusCache;
  const ahead  = st ? st.ahead  : 0;
  const behind = st ? st.behind : 0;
  const branch = st ? st.branch : '';
  const lastSync = localStorage.getItem(GIT_KEYS.lastSync);
  const lastSyncStr = lastSync ? new Date(lastSync).toLocaleString('ja-JP', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) : '未同期';
  const pullCls = behind > 0 ? ' behind' : '';
  const pushCls = ahead  > 0 ? ' ahead'  : '';
  const pullBadge = behind > 0 ? `<span class="git-cnt">${behind}</span>` : '';
  const pushBadge = ahead  > 0 ? `<span class="git-cnt">${ahead}</span>`  : '';
  const stash = getGitStash();
  const stashHint = stash ? ' ⚠️未解決' : '';
  return `<div class="git-sync-area">
    <div class="git-sync-status">
      <span class="git-branch">⎇ ${esc(branch || cfg.branch || '...')}${stashHint}</span>
      <span class="git-last">最終: ${lastSyncStr}</span>
    </div>
    <button class="git-sync-btn${pullCls}" data-a="git-pull" title="Pull" ${gitBusy ? 'disabled' : ''}>${I.pullIcon}Pull${pullBadge}</button>
    <button class="git-sync-btn${pushCls}" data-a="git-push" title="Push" ${gitBusy ? 'disabled' : ''}>${I.pushIcon}Push${pushBadge}</button>
    <button class="git-config-btn" data-a="open-git-config" title="設定">${I.git}</button>
  </div>`;
}
