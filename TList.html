    const split = splitGroupsByCompletion();
    activeList = arrangeForRender(applyTaskFilter(split.active));
    // フィルター有効時は完了セクションを非表示
    if (taskFilter !== 'all') {
      completedList = [];
      completedMainCount = 0;
    } else {
      completedList = arrangeForRender(split.completed);
      completedMainCount = split.completed.filter(t => !t.parentId).length;
    }
  }
  // フィルター適用後の残件数（フッター用）
  const filteredActiveCount = isMemoList
    ? c.total
    : currentTodos().filter(t => !t.completed && matchFilter(t)).length;

  const chevronRight = `<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>`;
  const renderItem = t => {
        // 完了サブのトグル行マーカー
        if (t._doneSubsHeader) {
          return `<li class="sub-done-header${t.expanded ? ' expanded' : ''}" data-a="toggle-done-subs" data-id="${t.parentId}">
            <span class="sub-done-caret${t.expanded ? ' open' : ''}">${chevronRight}</span>
            <span class="sub-done-label">完了 (${t.doneCount}件)</span>
          </li>`;
        }
        const editing = editId === t.id;
        const isSub = !!t.parentId;
        const hasSub = !isSub && hasSubs(t.id);
        const expanded = !collapsedIds.has(t.id);
        const body = editing ? `<div class="edit-form">
          <textarea id="ei-text" class="edit-text" rows="1" autocomplete="off">${esc(editText)}</textarea>
          <textarea id="ei-detail" class="edit-detail-inp" rows="1" placeholder="詳細・メモを入力（任意）..." autocomplete="off">${esc(editDetail)}</textarea>
          <div class="edit-actions">
            <div class="edit-actions-row3">
              <button class="edit-link-toggle" data-a="toggle-link-type" title="クリックで切替">${editLinkType === 'url' ? I.link : I.folder} ${editLinkType === 'url' ? 'URL' : 'フォルダ'}</button>
              <input id="ei-folder" class="edit-folder-inp" type="text" placeholder="${editLinkType === 'url' ? 'https://example.com' : 'フォルダパス（例: C:\\\\Users\\\\...）'}" value="${esc(editFolderPath)}" autocomplete="off">
              ${editFolderPath ? `<button class="edit-folder-clr" data-a="clr-folder" title="クリア">${I.x}</button>` : ''}
            </div>
            ${!editRecurrence?.type ? `<div class="edit-actions-row1">
              <span class="edit-date-label">開始</span>
              ${editStartDate
                ? `<div class="edit-date-wrap">
                     <label for="ei-start-date" class="edit-date-placeholder" style="color:var(--t2);">📅 ${editStartDate.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$2/$3')}</label>
                     <input id="ei-start-date" class="edit-date" type="date" value="${esc(editStartDate)}">
                   </div>
                   <button class="edit-clr" data-a="clr-start-date" title="クリア">${I.x}</button>`
                : `<div class="edit-date-wrap">
                     <label for="ei-start-date" class="edit-date-placeholder">📅 開始日</label>
                     <input id="ei-start-date" class="edit-date" type="date" value="">
                   </div>`
              }
              <span class="edit-date-label">終了</span>
              ${editDue
                ? `<div class="edit-date-wrap">
                     <label for="ei-date" class="edit-date-placeholder" style="color:var(--t2);">📅 ${editDue.replace(/^(\d{4})-(\d{2})-(\d{2})$/, '$2/$3')}</label>
                     <input id="ei-date" class="edit-date" type="date" value="${esc(editDue)}">
                   </div>
                   <button class="edit-clr" data-a="clr-date" title="クリア">${I.x}</button>`
                : `<div class="edit-date-wrap">
                     <label for="ei-date" class="edit-date-placeholder">📅 終了日</label>
                     <input id="ei-date" class="edit-date" type="date" value="">
                   </div>`
              }
            </div>` : ''}
            <div class="edit-actions-row1">
              <span class="edit-date-label">繰り返し</span>
              <select id="ei-recurrence-type" class="edit-recurrence">
                <option value=""        ${!editRecurrence?.type            ? 'selected' : ''}>なし</option>
                <option value="daily"   ${editRecurrence?.type === 'daily'   ? 'selected' : ''}>毎日</option>
                <option value="weekly"  ${editRecurrence?.type === 'weekly'  ? 'selected' : ''}>毎週</option>
                <option value="monthly" ${editRecurrence?.type === 'monthly' ? 'selected' : ''}>毎月</option>
              </select>
              ${editRecurrence?.type === 'weekly' ? `
                <select id="ei-recurrence-weekday" class="edit-recurrence">
                  ${WEEKDAY_LABELS.map((lbl, d) =>
                    `<option value="${d}" ${editRecurrence.weekday === d ? 'selected' : ''}>${lbl}曜</option>`
                  ).join('')}
                </select>` : ''}
              ${editRecurrence?.type === 'monthly' ? `
                <select id="ei-recurrence-day" class="edit-recurrence">
                  ${Array.from({length:30}, (_, i) => i + 1).map(d =>
                    `<option value="${d}" ${editRecurrence.day === d ? 'selected' : ''}>${d}日</option>`
                  ).join('')}
                  <option value="last" ${editRecurrence.day === 'last' ? 'selected' : ''}>末日</option>
                </select>` : ''}
            </div>
            <div class="edit-actions-row2">
              <button class="edit-cancel" data-a="cancel">キャンセル</button>
              <button class="edit-save" data-a="save">保存</button>
            </div>
          </div>
        </div>` : (() => {
          const ctxt = `<span class="todo-text${t.completed?' done':''}">${esc(t.text).replace(/\n/g,'<br>')}</span>`;
          // 完了日時表示
          let extra = '';
          if (t.completed && t.completedAt) {
            const d = new Date(t.completedAt);
            const mm = String(d.getMonth()+1).padStart(2,'0');
            const dd = String(d.getDate()).padStart(2,'0');
            const hh = String(d.getHours()).padStart(2,'0');
            const mi = String(d.getMinutes()).padStart(2,'0');
            extra = `<span class="completed-time">✓ ${mm}/${dd} ${hh}:${mi} 完了</span>`;
          }
          return `<div class="text-wrap-inner">${ctxt}${extra}</div>`;
        })();

        // 開始日と終了日が同日の場合は統合バッジ、それ以外は個別表示
        const sameDay = t.startDate && t.dueDate && t.startDate === t.dueDate;
        let badge = '';
        let startBadgeHtml = '';
        if (!t.completed && !editing) {
          if (sameDay) {
            badge = `<div class="due-wrap">${sameDayBadge(t.dueDate)}</div>`;
          } else {
            if (t.dueDate) badge = `<div class="due-wrap">${dueBadge(t.dueDate)}</div>`;
            if (t.startDate) {
              startBadgeHtml = `<div class="due-wrap">${startBadge(t.startDate)}</div>`;
            }
          }
        }
        const recLbl = (() => {
          if (!t.recurrence?.type) return '';
          if (t.recurrence.type === 'daily')   return '毎日';
          if (t.recurrence.type === 'weekly')  return '毎週' + WEEKDAY_LABELS[t.recurrence.weekday ?? 1];
          if (t.recurrence.type === 'monthly') return '毎月' + (t.recurrence.day === 'last' ? '末日' : (t.recurrence.day ?? 1) + '日');
          return '';
        })();
        const recurrenceBadgeHtml = (recLbl && !editing)
          ? `<div class="due-wrap"><span class="due-badge recurrence-badge" title="繰り返し: ${recLbl}">🔁 ${recLbl}</span></div>`
          : '';

        const togglePart = hasSub
          ? `<button class="sub-toggle${expanded ? ' expanded' : ''}" data-a="toggle-collapse" data-id="${t.id}" title="${expanded ? '折りたたむ' : '展開する'}">${chevronRight}</button>`
          : `<span class="sub-toggle-placeholder"></span>`;

        return `<li class="todo-item${isMemoList ? ' memo-item' : ''}${isSub ? ' is-sub' : ''}" data-id="${t.id}"${isSub ? ' data-sub="1"' : ''}>
          <div class="drag-handle" data-a="drag-handle" data-id="${t.id}" draggable="${!editing && !hasTouch}">${I.grip}</div>
          ${togglePart}
          <div class="cb-wrap"><div class="cb${t.completed?' checked':''}" data-a="toggle" data-id="${t.id}">${t.completed?I.check:''}</div></div>
          <div class="text-wrap" data-a="edit" data-id="${t.id}">${body}</div>
          ${t.detail && !editing ? `<div class="item-memo"><button data-a="memo-show" data-id="${t.id}"${memoPopupId === t.id ? ' class="active"' : ''}>${I.memo}</button></div>` : ''}
          ${t.folderPath && !editing && (t.linkType === 'url' || !hasTouch) ? `<div class="item-folder"><button data-a="folder-open" data-id="${t.id}" title="${esc(t.folderPath)}">${t.linkType === 'url' ? I.link : I.folder}</button></div>` : ''}
          ${!isSub && !editing ? `<div class="item-add-sub"><button data-a="add-sub-init" data-id="${t.id}" title="サブタスクを追加">${I.plus}</button></div>` : ''}
          ${startBadgeHtml}
          ${recurrenceBadgeHtml}
          ${badge}
          ${(t.completed || isMemoList) ? `<div class="item-del"><button data-a="to-trash" data-id="${t.id}">${I.trash}</button></div>` : ''}
        </li>`;
      };

  const items = activeList.length === 0
    ? `<li class="empty-msg">🎉 タスクがありません！</li>`
    : activeList.map(renderItem).join('');

  // 完了セクション（メモリストでは出さない／完了メインが0件のときは非表示）
  // フィルターチップ（メモリストでは出さない）
  const filterChips = !isMemoList ? `
    <div class="task-filters">
      ${[
        { k:'all',        l:'すべて',     ic:'' },
        { k:'actionable', l:'着手可能',   ic:'▶️' },
        { k:'week',       l:'今週中',     ic:'📅' },
        { k:'today',      l:'今日',       ic:'⚡' },
        { k:'overdue',    l:'超過',       ic:'🔥' },
      ].map(f => `<button class="task-filter-chip${taskFilter===f.k?' active':''}" data-a="set-task-filter" data-filter="${f.k}">${f.ic?`<span class="chip-ic">${f.ic}</span>`:''}${f.l}</button>`).join('')}
    </div>` : '';

  const completedSection = (!isMemoList && completedMainCount > 0) ? `
    <div class="completed-section">
      <button class="completed-section-hd" data-a="toggle-completed-section">
        <span class="completed-section-caret${showCompletedSection ? ' open' : ''}">${chevronRight}</span>
        <span class="completed-section-label">完了 (${completedMainCount}件)</span>
      </button>
      ${showCompletedSection ? `<ul class="todo-list completed-list">${
        completedList.length === 0
          ? `<li class="empty-msg">完了タスクなし</li>`
          : completedList.map(renderItem).join('')
      }</ul>` : ''}
    </div>` : '';

  // ゴミ箱内も「メイン → 関連サブ群」の順に並べ替えて表示
  // 関連サブ: _trashedWithParent === parent.id または parentId === parent.id
  const arrangedTrash = (() => {
    if (ct.length === 0) return [];
    const result = [];
    const used = new Set();
    ct.forEach(t => {
      if (t._trashedWithParent || t.parentId) return; // サブ系は後で処理
      result.push(t); used.add(t.id);
      ct.forEach(s => {
        if (used.has(s.id)) return;
        if (s._trashedWithParent === t.id || s.parentId === t.id) {
          result.push(s); used.add(s.id);
        }
      });
    });
    // 親不在の単体サブも末尾に
    ct.forEach(t => { if (!used.has(t.id)) { result.push(t); used.add(t.id); } });
    return result;
  })();
  const trashRenderItem = t => {
    const isSubLike = !!(t._trashedWithParent || t.parentId);
    return `<li class="trash-item${isSubLike ? ' is-sub' : ''}" data-id="${t.id}" draggable="${!hasTouch}">
        <span class="trash-item-text${t.completed?' was-done':''}">${esc(t.text).replace(/\n/g,'<br>')}</span>
        <div class="trash-actions">
          <button class="restore-btn" data-a="restore" data-id="${t.id}">${I.restore}復元</button>
          <div class="tip-wrap">
            <button class="del-btn" data-a="del-trash" data-id="${t.id}">${I.x}</button>
            <span class="tip">削除</span>
          </div>
        </div>
      </li>`;
  };
  const titems = ct.length === 0
    ? `<li class="trash-empty">ゴミ箱は空です</li>`
    : arrangedTrash.map(trashRenderItem).join('');

  const trashPanel = showTrash ? `<div class="trash-panel" id="trash-panel">
    <div class="trash-header">
      <span class="trash-title">${I.trash}ゴミ箱 (${ct.length})</span>
      ${ct.length > 0 ? `<button class="empty-all" data-a="empty">すべて削除</button>` : ''}
    </div>
    <ul class="trash-list">${titems}</ul>
  </div>` : '';

  const listName = selList ? esc(selList.name) : '';

  return `<div class="main-col">
    <div class="card">
      <div class="list-card-hd">
        <div class="list-card-icon${isMemoList ? ' memo-icon' : ''}">${isMemoList ? I.notepad : I.clip}</div>
        <span class="list-card-name">${listName}</span>
        <div class="sort-btns">
          ${(() => {
            const mainsWithSubs = currentTodos().filter(t => !t.parentId && hasSubs(t.id));
            if (mainsWithSubs.length === 0) return '';
            const allCollapsed = mainsWithSubs.every(t => collapsedIds.has(t.id));
            // チェックリスト内のサブトグル(▶/▽)と同じアイコンを使用
            const label = allCollapsed ? '全て展開' : '全て折り畳む';
            return `<div class="tip-wrap"><button class="sort-btn action-btn collapse-all-btn${allCollapsed ? '' : ' expanded'}" data-a="toggle-all-collapse" title="${label}">${chevronRight}</button><span class="tip">${label}</span></div>`;
          })()}
          <div class="tip-wrap"><button class="sort-btn action-btn" data-a="sort-by-date" title="日付順に並べる">${I.sortCal}</button><span class="tip">日付順に並べる</span></div>
        </div>
      </div>
      <div class="input-section">
        <form class="input-row${subInputParentId ? ' sub-mode' : ''}" data-a="add">
          <textarea id="todo-inp" class="todo-input" rows="1" placeholder="${subInputParentId ? `「${esc((todos.find(x=>x.id===subInputParentId)||{}).text||'')}」の${isMemoList ? 'サブメモ' : 'サブタスク'}を入力...` : (isMemoList ? '新しいメモを入力...' : '新しいタスクを入力...')}" autocomplete="off"></textarea>
          ${subInputParentId ? `<button type="button" class="cancel-sub-btn" data-a="cancel-sub-input" title="キャンセル">${I.x}</button>` : ''}
          <button type="submit" class="add-btn">追加</button>
        </form>
      </div>
      ${filterChips}
      <ul class="todo-list" id="todo-list">${items}</ul>
      ${completedSection}
      <div class="footer">
        <span class="remaining">${isMemoList ? `<strong>${c.total}</strong> 件` : `残り <strong>${filteredActiveCount}</strong> 件`}</span>
        <button class="trash-btn${showTrash?' open':''}" id="trash-btn" data-a="toggle-trash">
          ${I.trash}ゴミ箱
          ${ct.length > 0 ? `<span class="trash-cnt">${ct.length}</span>` : ''}
        </button>
      </div>
    </div>
    ${trashPanel}
  </div>`;
}

// ── Modal HTML ────────────────────────────────────────
function htmlModal() {
  if (!modalMode) return '';
  if (modalMode === 'git-config')    return htmlGitConfigModal();
  if (modalMode === 'git-merge')     return htmlGitMergeModal();
  if (modalMode === 'git-error')     return htmlGitErrorModal();
  if (modalMode === 'notify-config') return htmlNotifyConfigModal();
  const isExport = modalMode === 'export';
  const title = isExport ? 'エクスポート' : 'インポート';
  const actionLabel = isExport ? 'エクスポート' : 'インポート';
  const selectedCount = modalLists.filter(l => l.checked).length;
  const checkSvg = I.check;

  const allRow = `<div class="modal-check-row select-all" data-a="modal-toggle-all">
    <div class="modal-cb${modalAllChecked ? ' checked' : ''}">${checkSvg}</div>
    <span class="modal-list-name">すべて選択</span>
  </div>`;

  const rows = modalLists.map(l => {
    const cnt = isExport
      ? todos.filter(t => t.listId === l.id).length
      : (l.todoCount || 0);
    return `<div class="modal-check-row" data-a="modal-toggle" data-id="${l.id}">
      <div class="modal-cb${l.checked ? ' checked' : ''}">${checkSvg}</div>
      <span class="modal-list-name">${esc(l.name)}</span>
      <span class="modal-list-count">${cnt}件</span>
    </div>`;
  }).join('');

  return `<div class="modal-overlay" data-a="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">${title}</span>
        <button class="modal-close" data-a="modal-close">${I.x}</button>
      </div>
      <div class="modal-body">${allRow}${rows}</div>
      <div class="modal-footer">
        <button class="modal-btn-cancel" data-a="modal-close">キャンセル</button>
        <button class="modal-btn-primary" data-a="modal-confirm" ${selectedCount === 0 ? 'disabled' : ''}>${actionLabel} (${selectedCount})</button>
      </div>
    </div>
  </div>`;
}

// ── Git 同期モーダル ─────────────────────────────────────
function htmlGitConfigModal() {
  const d = gitConfigDraft || { ...DEFAULT_GIT_CONFIG };
  const test = gitConfigTestResult;
  let testBox = '';
  if (test) {
    if (test.ok) {
      const info = test.info || {};
      const lines = [];
      lines.push(`ブランチ: ${esc(info.branch || '(初期コミット前)')}`);
      if (info.head) lines.push(`HEAD: ${esc(info.head)}`);
      if (info.remote_url) lines.push(`リモート: ${esc(info.remote_url)}`);
      lines.push(`${d.fileName || 'tasks.json'}: ${info.file_exists ? '存在' : '未作成（初回 Push で作成）'}`);
      testBox = `<div class="git-info-box">${lines.join('<br>')}</div>`;
    } else {
      testBox = `<div class="git-info-box err">${esc(test.err || '失敗')}</div>`;
    }
  }
  const hasBaseline = !!localStorage.getItem(GIT_KEYS.baseline);
  const baselineBox = hasBaseline ? `
    <div class="git-info-box" style="display:flex; align-items:center; gap:8px;">
      <span style="flex:1;">ベースラインあり（過去に同期成功あり）</span>
      <button class="git-test-btn" data-a="git-baseline-reset" title="次回 Pull を初回扱いにする">リセット</button>
    </div>` : `
    <div class="git-info-box">ベースラインなし（次回 Pull は初回扱いで実行されます）</div>`;
  return `<div class="modal-overlay" data-a="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">⚙ Git 同期 設定</span>
        <button class="modal-close" data-a="modal-close">${I.x}</button>
      </div>
      <div class="git-modal-body">
        <label class="row">
          <input type="checkbox" id="git-cfg-enabled" ${d.enabled ? 'checked' : ''}>
          <span>Git 同期を有効にする</span>
        </label>
        <label class="fld">
          リポジトリパス（ローカル）
          <input type="text" id="git-cfg-path" value="${esc(d.repoPath)}" placeholder="C:\\path\\to\\local-repo" autocomplete="off">
        </label>
        <label class="fld">
          ファイル名（リポジトリ直下）
          <input type="text" id="git-cfg-file" value="${esc(d.fileName)}" placeholder="tasks.json" autocomplete="off">
        </label>
        <label class="fld">
          リモート名
          <input type="text" id="git-cfg-remote" value="${esc(d.remote)}" placeholder="origin" autocomplete="off">
        </label>
        <label class="fld">
          ブランチ（空欄なら現在ブランチ）
          <input type="text" id="git-cfg-branch" value="${esc(d.branch)}" placeholder="main" autocomplete="off">
        </label>
        <label class="fld">
          コミットメッセージのテンプレート
          <input type="text" id="git-cfg-msg" value="${esc(d.commitTemplate)}" placeholder="Update {file} via TList ({date})" autocomplete="off">
        </label>
        <button class="git-test-btn" data-a="git-config-test">接続テスト</button>
        ${testBox}
        ${baselineBox}
      </div>
      <div class="modal-footer">
        <button class="modal-btn-cancel" data-a="modal-close">キャンセル</button>
        <button class="modal-btn-primary" data-a="git-config-save">保存</button>
      </div>
    </div>
  </div>`;
}

function htmlGitMergeModal() {
  if (!gitMergeData) return '';
  const fmt = (v) => {
    if (!v) return '<span class="opt-content deleted">（削除されています）</span>';
    if (v.text !== undefined) {
      const dueStr = v.dueDate ? `\n期限: ${v.dueDate}` : '';
      const status = v.completed ? ' [完了]' : '';
      return `<span class="opt-content">${esc(String(v.text || '').split('\n')[0])}${status}${esc(dueStr)}</span>`;
    }
    if (v.name !== undefined) {
      return `<span class="opt-content">${esc(v.name)}${v.type ? ` [${esc(v.type)}]` : ''}</span>`;
    }
    return `<span class="opt-content">${esc(JSON.stringify(v))}</span>`;
  };
  const kindLabel = (k) => k === 'lists' ? 'リスト' : k === 'todos' ? 'タスク' : 'ゴミ箱';
  const items = gitMergeData.conflicts.map((c, i) => {
    const r = gitMergeData.resolutions[i];
    const opts = [
      { val:'ours',   label:'ローカル', data:c.ours },
      { val:'theirs', label:'リモート', data:c.theirs },
      { val:'both',   label:'両方残す', data:null },
    ];
    const optsHtml = opts.map(o => {
      const sel = r.choice === o.val ? ' selected' : '';
      const disabled = (o.val === 'both' && (!c.ours || !c.theirs)) ? ' style="display:none"' : '';
      const content = o.val === 'both'
        ? `<span class="opt-content">ローカル版を残しつつ、リモート版を新規 ID で追加</span>`
        : fmt(o.data);
      return `<label class="git-merge-option${sel}"${disabled} data-a="git-merge-pick" data-idx="${i}" data-choice="${o.val}">
        <input type="radio" name="git-merge-${i}" ${sel ? 'checked' : ''}>
        <div style="flex:1; min-width:0;">
          <div class="opt-label">${o.label}</div>
          ${content}
        </div>
      </label>`;
    }).join('');
    return `<div class="git-merge-item">
      <div class="git-merge-head">
        <span class="kind-tag">${kindLabel(c.kind)}</span>
        ID: <code>${esc(c.id.slice(0, 8))}…</code>
      </div>
      <div class="git-merge-options">${optsHtml}</div>
    </div>`;
  }).join('');

  return `<div class="modal-overlay" data-a="modal-overlay">

// ── Memo popup HTML ───────────────────────────────────
function htmlMemoPopup() {
  if (!memoPopupId) return '';
  const t = todos.find(x => x.id === memoPopupId);
  if (!t?.detail) return '';

  // ボタン位置に基づいて表示位置を計算
  let posStyle = '';
  if (memoPopupPos) {
    const p = memoPopupPos;
    const vw = window.innerWidth, vh = window.innerHeight;
    const GAP = 8, PAD = 8;
    const POP_W = Math.min(500, vw - 32);

    // 常にボタンの下側に表示、収まらない場合のみ上側
    const availDown = vh - p.bottom - GAP - PAD;
    const availUp = p.top - GAP - PAD;
    let vert, maxH;
    if (availDown >= 120 || availDown >= availUp) {
      maxH = Math.max(100, availDown);
      vert = `top:${p.bottom + GAP}px; bottom:auto;`;
    } else {
      maxH = Math.max(100, availUp);
      vert = `bottom:${vh - p.top + GAP}px; top:auto;`;
    }

    // 左右：ボタン位置基準で中央寄せ、はみ出しをクランプ
    let left = Math.round(p.left + (p.right - p.left) / 2 - POP_W / 2);
    if (left + POP_W > vw - PAD) left = vw - POP_W - PAD;
    if (left < PAD) left = PAD;
    posStyle = `${vert} left:${left}px; width:${POP_W}px; transform:none; max-height:${maxH}px;`;
  }

  return `<div class="memo-popup" id="memo-popup"${posStyle ? ` style="${posStyle}"` : ''}>
    <span class="memo-popup-label">${I.memo}メモ</span>
    <div class="memo-popup-text">${esc(t.detail).replace(/\n/g,'<br>')}</div>
  </div>`;
}

function render() {
  applyRecurringResets();
  const sy = window.scrollY;
  document.getElementById('app').innerHTML = html();
  window.scrollTo(0, sy);
  if (editId && !skipFocusRestore) {
    const inp = document.getElementById('ei-text');
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
  skipFocusRestore = false;
  if (editingListId) {
    const inp = document.getElementById('list-rename-inp');
    if (inp) { inp.focus(); inp.select(); }
  }
  if (addingList) {
    const inp = document.getElementById('list-add-inp');
    if (inp) inp.focus();
  }
  // タスクバー/Dock バッジを更新（fire-and-forget、render をブロックしない）
  updateBadge(computeBadgeCount());
  // UI 表示状態を永続化（折りたたみ・展開・フィルター等）
  saveUiState();
}

// ── Todo Actions ───────────────────────────────────────
function toggleDark() {
  const d = document.documentElement.classList.toggle('dark');
  localStorage.setItem('darkMode', String(d));
  render();
}
function insertAtListStart(task, lid) {
  const i = todos.findIndex(x => x.listId === lid);
  if (i >= 0) todos.splice(i, 0, task); else todos.push(task);
}
function addTodo(form) {
  const inp = form ? form.querySelector('textarea.todo-input')
            : (document.getElementById('todo-inp') || document.getElementById('todo-inp-mobile'));
  const text = inp?.value.trim();
  if (!text) return;
  const newTask = { id: crypto.randomUUID(), text, completed: false, createdAt: Date.now(), listId: selectedListId };
  // サブタスク入力モード：親IDを設定し、親直下に挿入。モードは継続（連続追加可能）
  if (subInputParentId) {
    const parent = todos.find(x => x.id === subInputParentId);
    if (parent && !parent.parentId) {
      newTask.parentId = subInputParentId;
      // 親の既存サブの末尾に挿入
      const lastSubIdx = todos.reduce((acc, x, i) => x.parentId === subInputParentId ? i : acc, -1);
      const parentIdx = todos.findIndex(x => x.id === subInputParentId);
      const insertAt = (lastSubIdx >= 0 ? lastSubIdx : parentIdx) + 1;
      todos.splice(insertAt, 0, newTask);
      save(); render();
      (document.getElementById('todo-inp') || document.getElementById('todo-inp-mobile'))?.focus();
      return;
    }
  }
  // 先頭追加がデフォルト
  insertAtListStart(newTask, selectedListId);
  save(); render();
  (document.getElementById('todo-inp') || document.getElementById('todo-inp-mobile'))?.focus();
}
function toggleTodo(id) {
  const idx = todos.findIndex(x => x.id === id);
  if (idx < 0) return;
  const t = todos[idx];
  const selList = lists.find(l => l.id === t.listId);
  if (selList?.type === 'memo') return;
  t.completed = !t.completed;
  if (t.completed) t.completedAt = Date.now();
  else t.completedAt = undefined;
  save(); render();
  if (t.completed) {
    requestAnimationFrame(() => {
      const cb = document.querySelector(`.cb[data-id="${id}"]`);
      if (cb) cb.classList.add('animate');
      const txt = document.querySelector(`.todo-item[data-id="${id}"] .todo-text`);
      if (txt) txt.classList.add('animate');
    });
  }
}
function sortByDate() {
  const lid = selectedListId;
  const mine = todos.filter(x => x.listId === lid);
  const dateCmp = (a, b) => {
    if (!a.dueDate && !b.dueDate) return 0;
    if (!a.dueDate) return 1;   // 日付なしは末尾
    if (!b.dueDate) return -1;
    return a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0;
  };
  const sorted = [...mine].sort(dateCmp);
  let si = 0;
  todos = todos.map(t => t.listId === lid ? sorted[si++] : t);
  save(); render();
}
function startEdit(id) {
  window.getSelection()?.removeAllRanges();
  const t = todos.find(x => x.id === id);
  if (!t) return;
  const selList = lists.find(l => l.id === t.listId);
  if (t.completed && selList?.type !== 'memo') return;
  editId = id; editText = t.text; editDue = t.dueDate || ''; editStartDate = t.startDate || ''; editFolderPath = t.folderPath || ''; editLinkType = t.linkType || 'folder'; editDetail = t.detail || ''; editRecurrence = (t.recurrence && typeof t.recurrence === 'object') ? { ...t.recurrence } : {};
  memoPopupId = null; memoPopupPos = null;
  render();
}
function resetEditState() { editId = null; editText = ''; editDue = ''; editStartDate = ''; editFolderPath = ''; editLinkType = 'folder'; editDetail = ''; editRecurrence = {}; }
function commitEdit() {
  const text = editText.trim();
  if (text && editId) {
    const t = todos.find(x => x.id === editId);
    if (t) {
      t.text = text;
      t.folderPath = editFolderPath.trim() || undefined;
      t.linkType = editFolderPath.trim() ? editLinkType : undefined;
      t.detail = editDetail.trim() || undefined;
      if (editRecurrence?.type) {
        // 繰り返し ON: dueDate を自動計算、startDate はクリア
        const rec = { type: editRecurrence.type };
        if (rec.type === 'weekly')  rec.weekday = editRecurrence.weekday ?? 1;
        if (rec.type === 'monthly') rec.day     = editRecurrence.day     ?? 1;
        t.recurrence = rec;
        t.dueDate = computeFirstDueDate(rec);
        t.startDate = undefined;
      } else {
        // 繰り返し OFF: 通常の編集
        t.recurrence = undefined;
        t.dueDate    = editDue       || undefined;
        t.startDate  = editStartDate || undefined;
      }
    }
    save();
  }
  resetEditState(); render();
}
function cancelEdit() { resetEditState(); render(); }
function moveToTrash(id) {
  const i = todos.findIndex(x => x.id === id);
  if (i < 0) return;
  const t = todos[i];
  // メイン削除時はサブも一緒に
  if (!t.parentId) {
    const subs = todos.filter(x => x.parentId === id);
    subs.forEach(s => { s._trashedWithParent = id; trash.unshift(s); });
    todos = todos.filter(x => x.parentId !== id);
  }
  const idx2 = todos.findIndex(x => x.id === id);
  if (idx2 >= 0) trash.unshift(todos.splice(idx2, 1)[0]);
  save(); render();
}
function restoreFromTrash(id, asCompleted) {
  const i = trash.findIndex(x => x.id === id);
  if (i < 0) return;
  const item = trash.splice(i, 1)[0];
  if (asCompleted !== undefined) item.completed = asCompleted;
  // メインなら関連サブ（_trashedWithParent一致 or parentId一致）を全て復元
  if (!item.parentId) {
    const relatedSubs = trash.filter(x => x._trashedWithParent === item.id || x.parentId === item.id);
    trash = trash.filter(x => !(x._trashedWithParent === item.id || x.parentId === item.id));
    relatedSubs.forEach(s => { delete s._trashedWithParent; todos.push(s); });
  } else {
    // サブ単体を復元する場合、元の親が todos に存在しなければメイン化して戻す
    const parentExists = todos.some(x => x.id === item.parentId && !x.parentId && x.listId === item.listId);
    if (!parentExists) item.parentId = undefined;
  }
  delete item._trashedWithParent;
  todos.push(item); save(); render();
}
function deleteFromTrash(id) {
  const item = trash.find(x => x.id === id);
  if (item && !item.parentId) {
    // 関連サブ（_trashedWithParent一致 or parentId一致）も完全削除
    trash = trash.filter(x => x._trashedWithParent !== id && x.parentId !== id);
  }
  trash = trash.filter(x => x.id !== id);
  save(); render();
}
function emptyTrash()        { trash = trash.filter(x => x.listId !== selectedListId); save(); render(); }

function reorder(fromId, toId) {

  const to   = todos.findIndex(x => x.id === toId);
  if (from < 0 || to < 0) return;
  todos.splice(to, 0, todos.splice(from, 1)[0]);
  save(); render();
}

  lists.splice(to, 0, lists.splice(from, 1)[0]);

function selectList(id) {
  if (selectedListId === id) return;
  selectedListId = id;
  showTrash = false; editId = null; subInputParentId = null; taskFilter = 'all';
  if (isMobile()) sidebarOpen = false; // モバイルではリスト選択後サイドバーを閉じる
  render();

function startRenameList(id) {
  const lst = lists.find(l => l.id === id);
  if (!lst) return;
  editingListId = id; editingListName = lst.name; editingListType = lst.type || 'todo';
  render();
}
function commitRenameList() {
  if (!editingListId) return;
  const name = editingListName.trim();
  if (name) {
    const lst = lists.find(l => l.id === editingListId);
    if (lst) {
      lst.name = name;
      const oldType = lst.type || 'todo';
      const newType = editingListType;
      if (oldType === 'todo' && newType === 'memo') {
        const doneTasks = todos.filter(x => x.listId === lst.id && x.completed);
        if (doneTasks.length > 0) {
          doneTasks.forEach(dt => { dt.completed = false; trash.unshift(dt); });
          todos = todos.filter(x => !(x.listId === lst.id && doneTasks.includes(x)));
        }
        lst.type = 'memo';
      } else if (oldType === 'memo' && newType === 'todo') {
        lst.type = undefined;
      }
      save();
    }
  }
  editingListId = null; editingListType = 'todo'; render();
}
function commitAddList() {
  if (!addingList) return;
  const name = newListName.trim();
  addingList = false; newListName = '';
  if (name) {
    const newList = { id: crypto.randomUUID(), name, createdAt: Date.now() };
    lists.push(newList);
    selectedListId = newList.id;
    showTrash = false;
    if (isMobile()) sidebarOpen = false;
    save();
  }
  render();
}
function handleDeleteList(id) {
  if (lists.length <= 1) return;
  const lst = lists.find(l => l.id === id);
  if (!lst) return;
  listTrash.unshift({
    list: lst,
    todos: todos.filter(t => t.listId === id),
    trash: trash.filter(t => t.listId === id),
    deletedAt: Date.now(),
  });
  lists = lists.filter(l => l.id !== id);
  todos = todos.filter(t => t.listId !== id);
  trash = trash.filter(t => t.listId !== id);
  if (selectedListId === id) { selectedListId = lists[0].id; showTrash = false; }
  save(); render();
}
function restoreList(index) {
  const entry = listTrash[index];
  if (!entry) return;
  listTrash.splice(index, 1);
  lists.push(entry.list);
  todos.push(...entry.todos);
  trash.push(...entry.trash);
  selectedListId = entry.list.id; showTrash = false;
  save(); render();
}
function deleteListPermanently(index) {
  listTrash.splice(index, 1);
  save(); render();
}
function emptyListTrash() { listTrash = []; save(); render(); }
function toggleListTrash() { showListTrash = !showListTrash; render(); }
function toggleListStats() { showListStats = !showListStats; localStorage.setItem('todo-app-show-stats', showListStats); render(); }

// ── Move-to-list popup ───────────────────────────────
let movePopupOpenedAt = 0;
function showMovePopup(todoId) { movePopupTodoId = todoId; movePopupOpenedAt = Date.now(); render(); }
function closeMovePopup() { if (Date.now() - movePopupOpenedAt < 400) return; movePopupTodoId = null; render(); }
function moveToList(todoId, listId) {
  const t = todos.find(x => x.id === todoId);
  if (t && t.listId !== listId) {
    const targetList = lists.find(l => l.id === listId);
    const isMemoTarget = targetList?.type === 'memo';
    if (isMemoTarget && t.completed) t.completed = false;
    t.listId = listId;
    if (!t.parentId) {
      // メインタスク：サブもまとめて移動（親子関係は保持）
      todos.filter(x => x.parentId === t.id).forEach(s => {
        if (isMemoTarget && s.completed) s.completed = false;
        s.listId = listId;
      });
    } else {
      // サブタスク単体を移動：親は元リストに残るため、親子関係を解除（メイン化）
      t.parentId = undefined;
    }
    save();
  }
  movePopupTodoId = null; render();
}
function promoteSubToMain(id) {
  const t = todos.find(x => x.id === id);
  if (!t || !t.parentId) return;
  t.parentId = undefined;
  save();
  movePopupTodoId = null;
  render();
}

// 全リスト or 選択リストの export payload を組み立てる（純粋関数）
// opts.includeTimestamp: true なら exportedAt を含める（DL用）、false なら含めない（Git同期用）
function buildExportPayload(selectedIdsOrNull, opts = {}) {
  const { includeTimestamp = true } = opts;
  const stripInternal = t => { const { _trashedWithParent, ...rest } = t; return rest; };
  const ts = includeTimestamp ? { exportedAt: new Date().toISOString() } : {};
  if (selectedIdsOrNull) {
    return {
      version: 1,
      ...ts,
      lists: lists.filter(l => selectedIdsOrNull.has(l.id)),
      todos: todos.filter(t => selectedIdsOrNull.has(t.listId)).map(stripInternal),
      trash: trash.filter(t => selectedIdsOrNull.has(t.listId)).map(stripInternal),
    };
  }
  return {
    version: 1,
    ...ts,
    lists: lists.map(l => ({ ...l })),
    todos: todos.map(stripInternal),
    trash: trash.map(stripInternal),
  };
}

// payload を localStorage に直接反映（ID 同一性を保つ＝Git 同期用）
function applyExportPayloadInPlace(payload) {
  if (!validateImportData(payload)) throw new Error('invalid payload');
  lists    = (payload.lists || []).map(l => ({ ...l }));
  todos    = (payload.todos || []).map(t => ({ ...t }));
  trash    = (payload.trash || []).map(t => ({ ...t }));
  repairAfterLoad();
  if (!lists.find(l => l.id === selectedListId)) selectedListId = lists[0]?.id || '';
  save();
}

function executeExport() {
  const selectedIds = new Set(modalLists.filter(l => l.checked).map(l => l.id));
  if (selectedIds.size === 0) return;
  const payload = buildExportPayload(selectedIds);
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tasks-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeModal();
}
function openImportModal() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => processImportFile(ev.target.result);
    reader.readAsText(file);
  };
  input.click();
}
function processImportFile(text) {
  try {
    const data = JSON.parse(text);
    if (!validateImportData(data)) { alert('無効なファイル形式です。'); return; }
    importPayload = data;
    modalMode = 'import';
    modalLists = data.lists.map(l => ({
      id: l.id, name: l.name, checked: true,
      todoCount: (data.todos || []).filter(t => t.listId === l.id).length,
    }));
    modalAllChecked = true;
    render();
  } catch { alert('ファイルの読み込みに失敗しました。'); }
}
function validateImportData(data) {
  if (!data || typeof data !== 'object') return false;
  if (!Array.isArray(data.lists) || data.lists.length === 0) return false;
  if (!Array.isArray(data.todos)) return false;
  if (!data.lists.every(l => l.id && l.name)) return false;
  return true;
}
function executeImport() {
  const selectedIds = new Set(modalLists.filter(l => l.checked).map(l => l.id));
  if (selectedIds.size === 0 || !importPayload) return;
  const idMap = new Map();
  const existingNames = new Set(lists.map(l => l.name));
  for (const l of importPayload.lists) {
    if (!selectedIds.has(l.id)) continue;
    const newId = crypto.randomUUID();
    idMap.set(l.id, newId);
    let name = l.name;
    if (existingNames.has(name)) {
      let n = 2;
      while (existingNames.has(`${l.name} (${n})`)) n++;
      name = `${l.name} (${n})`;
    }
    existingNames.add(name);
    const newList = { id: newId, name, createdAt: l.createdAt || Date.now() };
    if (l.type) newList.type = l.type;
    lists.push(newList);
  }
  // 旧ID → 新ID のタスクマップ（parentId 解決用）
  const todoIdMap = new Map();
  let orphanCount = 0;
  // 先に全タスクの新ID生成（parentId 解決のため）
  const importTodos = (importPayload.todos || []).filter(t => selectedIds.has(t.listId) && idMap.get(t.listId));
  importTodos.forEach(t => todoIdMap.set(t.id, crypto.randomUUID()));
  const importTodoIdSet = new Set(importTodos.map(t => t.id));
  for (const t of importTodos) {
    const newListId = idMap.get(t.listId);
    let newParentId = undefined;
    if (t.parentId) {
      if (importTodoIdSet.has(t.parentId)) {
        newParentId = todoIdMap.get(t.parentId);
      } else {
        // 親が import 内に存在しない → 孤児化（メインに変換）
        orphanCount++;
      }
    }
    const newTask = { ...t, id: todoIdMap.get(t.id), listId: newListId };
    if (newParentId) newTask.parentId = newParentId;
    else delete newTask.parentId;
    todos.push(newTask);
  }
  for (const t of (importPayload.trash || [])) {
    if (!selectedIds.has(t.listId)) continue;
    const newListId = idMap.get(t.listId);
    if (!newListId) continue;
    const newItem = { ...t, id: crypto.randomUUID(), listId: newListId };
    delete newItem.parentId;
    delete newItem._trashedWithParent;
    trash.push(newItem);
  }
  if (orphanCount > 0) showToast(`⚠️ 親が見つからないサブタスク ${orphanCount} 件をメインに変換しました`);
  save();
  const firstImported = idMap.values().next().value;
  if (firstImported) { selectedListId = firstImported; showTrash = false; }
  closeModal();
}

// ── Git 同期 ──────────────────────────────────────────────
const GIT_KEYS = {
  config:   'todo-app-git-config',
  baseline: 'todo-app-git-baseline',
  stash:    'todo-app-git-stash',
  lastSync: 'todo-app-git-last-sync',
};
const DEFAULT_GIT_CONFIG = {
  enabled: false, repoPath: '', fileName: 'tasks.json',
  remote: 'origin', branch: '',
  commitTemplate: 'Update {file} via TList ({date})',
};

function getGitConfig() {
  try {
    const v = JSON.parse(localStorage.getItem(GIT_KEYS.config) || '{}');
    return { ...DEFAULT_GIT_CONFIG, ...v };
  } catch { return { ...DEFAULT_GIT_CONFIG }; }
}
function setGitConfig(cfg) {
  localStorage.setItem(GIT_KEYS.config, JSON.stringify(cfg));
}
function getGitBaseline() {
  const s = localStorage.getItem(GIT_KEYS.baseline);
  if (!s) return null;
  try { return JSON.parse(s); } catch { return null; }
}
function setGitBaseline(payload) {
  localStorage.setItem(GIT_KEYS.baseline, JSON.stringify(payload));
  localStorage.setItem(GIT_KEYS.lastSync, new Date().toISOString());
}
function getGitStash() {
  const s = localStorage.getItem(GIT_KEYS.stash);
  if (!s) return null;
  try { return JSON.parse(s); } catch { return null; }
}
function setGitStash(payload) {
  if (payload) localStorage.setItem(GIT_KEYS.stash, JSON.stringify(payload));
  else localStorage.removeItem(GIT_KEYS.stash);
}

function tauriInvoke() {
  return window.__TAURI__?.core?.invoke || null;
}
function isTauriEnv() {
  return !!tauriInvoke();
}

function formatGitCommitMessage(template, fileName) {
  const date = new Date();
  const pad = n => String(n).padStart(2, '0');
  const dateStr = `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
  return (template || DEFAULT_GIT_CONFIG.commitTemplate)
    .replace('{file}', fileName || 'tasks.json')
    .replace('{date}', dateStr);
}

// エラーメッセージから種別を推定して、UI 向けの説明文を返す
function classifyGitError(errMsg) {
  const m = String(errMsg || '');
  if (m.includes('git の起動に失敗') || m.includes('git CLI が見つかりません')) {
    return { title: 'Git CLI が見つかりません', hint: 'Git for Windows をインストールしてください。https://git-scm.com/download/win から入手できます。' };
  }
  if (m.match(/Authentication failed|could not read Username|Permission denied|fatal: Authentication/i)) {
    return { title: '認証に失敗しました', hint: 'コマンドプロンプトで `gh auth login` または `git push` を一度実行し、Windows 資格情報マネージャに認証情報を保存してください。' };
  }
  if (m.match(/Could not resolve host|Failed to connect|unable to access/i)) {
    return { title: 'ネットワークに接続できません', hint: 'インターネット接続を確認してください。' };
  }
  if (m.includes('指定パスは git リポジトリではありません')) {
    return { title: 'Git リポジトリではありません', hint: 'ローカルで `git clone` 済みのフォルダのパスを指定してください。' };
  }
  if (m.includes('リポジトリが見つかりません')) {
    return { title: 'パスが見つかりません', hint: '設定画面のパスを確認してください。' };
  }
  if (m.match(/Updates were rejected|non-fast-forward|tip of your current branch is behind/i)) {
    return { title: 'リモートが先行しています', hint: '先に Pull を実行してから Push してください。' };
  }
  if (m.match(/does not exist|exists on disk, but not in/)) {
    return { title: 'ファイルが見つかりません', hint: 'リモートに tasks.json がまだ存在しないか、ブランチを確認してください。' };
  }
  return { title: 'Git 操作に失敗しました', hint: '詳細は下のメッセージを確認してください。' };
}

function showGitError(title, err) {
  const errMsg = (err && err.message) ? err.message : String(err || '');
  const c = classifyGitError(errMsg);
  gitErrorPayload = {
    title: title || c.title,
    hint: c.hint,
    detail: errMsg,
  };
  modalMode = 'git-error';
  render();
}

// 入力フィールドから gitConfigDraft に値を吸い上げる
function syncGitConfigDraftFromInputs() {

  const $ = id => document.getElementById(id);
  gitConfigDraft.enabled        = $('git-cfg-enabled')?.checked || false;
  gitConfigDraft.repoPath       = $('git-cfg-path')?.value     ?? gitConfigDraft.repoPath;

async function gitConfigTest() {
  if (!gitConfigDraft) return;
  syncGitConfigDraftFromInputs();
  const invoke = tauriInvoke();
  if (!invoke) return;
  try {
    const info = await invoke('git_validate_repo', {
      repoPath: (gitConfigDraft.repoPath || '').trim(),
      fileName: (gitConfigDraft.fileName || 'tasks.json').trim() || 'tasks.json',
    });
    gitConfigTestResult = { ok: true, info };
  } catch (e) {
    gitConfigTestResult = { ok: false, err: String(e) };
  }
  render();
}

function gitConfigSave() {
  if (!gitConfigDraft) return;
  // 簡易バリデーション
  gitConfigDraft.repoPath = (gitConfigDraft.repoPath || '').trim();
  gitConfigDraft.fileName = (gitConfigDraft.fileName || 'tasks.json').trim() || 'tasks.json';
  gitConfigDraft.remote   = (gitConfigDraft.remote   || 'origin').trim() || 'origin';
  gitConfigDraft.branch   = (gitConfigDraft.branch   || '').trim();
  setGitConfig(gitConfigDraft);
  gitConfigDraft = null;
  gitConfigTestResult = null;
  closeModal();
  refreshGitStatus(); // 非同期、結果は次の render で
}

async function refreshGitStatus() {
  const cfg = getGitConfig();
  if (!cfg.enabled || !cfg.repoPath || !isTauriEnv()) {
    if (gitStatusCache) { gitStatusCache = null; render(); }
    return;
  }
  try {
    const st = await tauriInvoke()('git_status', {
      repoPath: cfg.repoPath, fileName: cfg.fileName,
    });
    gitStatusCache = st;
    render();
  } catch (e) {
    // ステータス取得失敗は静かに（バッジ非表示）
    gitStatusCache = null;
  }
}

async function gitPull() {
  if (gitBusy) return;
  const cfg = getGitConfig();
  if (!cfg.enabled || !cfg.repoPath) { openGitConfigModal(); return; }
  const invoke = tauriInvoke();
  if (!invoke) return;
  gitBusy = true;
  try {
    showToast('⬇️ Pull 中...');
    await invoke('git_fetch', { repoPath: cfg.repoPath, remote: cfg.remote || 'origin' });
    const st = await invoke('git_status', { repoPath: cfg.repoPath, fileName: cfg.fileName });
    gitStatusCache = st;

    if (!st.has_upstream) {
      showToast('⚠️ 上流ブランチが未設定です（初回 Push を先に実行してください）');
      return;
    }

    const baselineSaved = getGitBaseline();

    // リモート（または HEAD）の tasks.json を取得
    const ref = st.behind > 0 ? 'FETCH_HEAD' : 'HEAD';
    let theirsText;
    try {
      theirsText = await invoke('git_read_file_at_ref', {
        repoPath: cfg.repoPath, fileName: cfg.fileName, gitRef: ref,
      });
    } catch (e) {
      showGitError('リモートのファイル取得に失敗しました', e);
      return;
    }
    if (theirsText === null) {
      // ref に tasks.json がない（リモートにまだファイルがない、ブランチ違い等）
      // 取り込めるデータが無いのにマージを進めるとローカルが「全削除した」と誤解され、
      // Push 時にデータが消えるためここで明示的に止める。
      // ただし、ローカルもデータが空に近い「初回 Push 待ち」状態なら、エラーではなく案内する
      const oursPre = buildExportPayload(null, { includeTimestamp: false });
      const oursIsEmpty = oursPre.lists.length <= 1 && oursPre.todos.length === 0 && oursPre.trash.length === 0;
      if (oursIsEmpty) {
        showToast('ℹ️ リモートに ' + cfg.fileName + ' がまだありません。Push で初回作成してください');
      } else {
        showGitError(
          `リモートに ${cfg.fileName} が見つかりません`,
          `${ref} に ${cfg.fileName} が含まれていません。\n\n` +
          `考えられる原因:\n` +
          `・リモートにファイルがまだ Push されていない\n` +
          `・設定のブランチ名(${cfg.branch || st.branch})がリモートと違う\n` +
          `・ファイル名(${cfg.fileName})の設定間違い\n\n` +
          `そのまま Push するとローカルの内容で上書きされます。`
        );
      }
      return;
    }

    let theirs;
    try {
      theirs = JSON.parse(theirsText);
    } catch (e) {
      showGitError(`${cfg.fileName} の JSON 解析に失敗しました`, e);
      return;
    }
    const baseline = baselineSaved || emptyPayload();
    const ours = buildExportPayload(null, { includeTimestamp: false });

    // behind=0 で、かつローカル localStorage の内容がリモート tasks.json と一致 → 本当に最新
    if (st.behind === 0 && payloadsEquivalent(ours, theirs)) {
      showToast(`✅ すでに最新です（リスト ${ours.lists.length} / タスク ${ours.todos.length}）`);
      setGitBaseline(theirs);
      return;
    }

    // behind > 0 かつローカル変更なし（ours == baseline）→ git pull --ff-only でローカルブランチを前進
    // これがあるべき「git pull」動作：リモートを取得してローカルブランチを進める
    const oursUnchanged = baselineSaved && payloadsEquivalent(ours, baseline);
    if (st.behind > 0 && oursUnchanged && !st.has_target_file_change) {
      try {
        await invoke('git_pull_ff_only', {
          repoPath: cfg.repoPath,
          remote: cfg.remote || 'origin',
          branch: cfg.branch || null,
        });
        applyExportPayloadInPlace(theirs);
        setGitBaseline(theirs);
        await refreshGitStatus();
        render();
        const beforeCount = ours.todos.length;
        const addedTodos = theirs.todos.length - beforeCount;
        const delta = addedTodos > 0 ? ` +${addedTodos}` : addedTodos < 0 ? ` ${addedTodos}` : '';
        showToast(`⬇️ Pull 完了：リスト ${theirs.lists.length} / タスク ${theirs.todos.length}${delta}`);
        return;
      } catch (e) {
        // ff-only 失敗時は 3-way マージにフォールバック
        console.warn('ff-only failed, fallback to 3-way merge:', e);
      }
    }

    // 3-way マージ
    const mergeResult = mergeThreeWay(baseline, ours, theirs);

    if (mergeResult.conflicts.length === 0) {
      // 自動マージで完結
      const beforeCount = ours.todos.length;
      applyExportPayloadInPlace(mergeResult.merged);
      // 先にローカルブランチをリモートに ff-only で追従させる
      // （これをしないとローカルが枝分かれして次の Push が拒否される）
      if (st.behind > 0) {
        try {
          await invoke('git_pull_ff_only', {
            repoPath: cfg.repoPath,
            remote: cfg.remote || 'origin',
            branch: cfg.branch || null,
          });
        } catch (ffErr) {
          // ff-only 失敗時はそのまま続行（merge commit 風になるが Push は別途エラーで気付く）
          console.warn('git pull --ff-only before merge commit failed:', ffErr);
        }
      }
      await writeAndCommit(cfg, mergeResult.merged, 'Merge remote (auto)');
      setGitBaseline(mergeResult.merged);
      await refreshGitStatus();
      render();
      const m = mergeResult.merged;
      const addedTodos = m.todos.length - beforeCount;
      const delta = addedTodos > 0 ? ` +${addedTodos}` : addedTodos < 0 ? ` ${addedTodos}` : '';
      showToast(`🔀 自動マージ完了：リスト ${m.lists.length} / タスク ${m.todos.length}${delta}`);
    } else {
      // 競合 → 退避してマージ UI を開く
      setGitStash(ours);
      gitMergeData = {
        base: baseline,
        ours,
        theirs,
        mergedAuto: mergeResult.merged,
        conflicts: mergeResult.conflicts,
        resolutions: mergeResult.conflicts.map(c => ({ id: c.id, kind: c.kind, choice: 'ours' })),
      };
      modalMode = 'git-merge';
      render();
    }
  } catch (e) {
    showGitError('Pull に失敗しました', e);
  } finally {
    gitBusy = false;
    render();
  }
}

async function gitPush() {
  if (gitBusy) return;
  const cfg = getGitConfig();
  if (!cfg.enabled || !cfg.repoPath) { openGitConfigModal(); return; }
  const invoke = tauriInvoke();
  if (!invoke) return;
  gitBusy = true;
  try {
    showToast('⬆️ Push 中...');
    // 先に fetch でリモート状態を確認
    await invoke('git_fetch', { repoPath: cfg.repoPath, remote: cfg.remote || 'origin' });
    const st = await invoke('git_status', { repoPath: cfg.repoPath, fileName: cfg.fileName });
    gitStatusCache = st;

    if (st.has_upstream && st.behind > 0) {
      // リモートが先行 → 先に Pull して取り込んでから Push を続行
      showToast('⚠️ リモートに新しい変更があります。先に Pull します');
      gitBusy = false;
      await gitPull();
      gitBusy = true;
      // Pull で衝突マージモーダルが出ている場合は中断（ユーザー操作待ち）
      if (modalMode === 'git-merge') {
        return;
      }
      // 再度 status を確認。まだ behind > 0 なら何かおかしい
      await invoke('git_fetch', { repoPath: cfg.repoPath, remote: cfg.remote || 'origin' });
      const st2 = await invoke('git_status', { repoPath: cfg.repoPath, fileName: cfg.fileName });
      gitStatusCache = st2;
      if (st2.has_upstream && st2.behind > 0) {
        showGitError('Pull 後もリモートが先行しています',
          'ローカルブランチがリモートと枝分かれしている可能性があります。\n' +
          '一度コマンドプロンプトで以下を実行してリポジトリをリモートに合わせてください:\n\n' +
          `cd ${cfg.repoPath}\n` +
          'git fetch origin\n' +
          `git reset --hard origin/${st2.branch}\n\n` +
          'その後、アプリの設定モーダルから「ベースラインをリセット」してから Pull → Push の順に実行してください。');
        return;
      }
    }

    const payload = buildExportPayload(null, { includeTimestamp: false });
    const content = JSON.stringify(payload, null, 2);
    await invoke('git_write_file', {
      repoPath: cfg.repoPath, fileName: cfg.fileName, content,
    });
    const msg = formatGitCommitMessage(cfg.commitTemplate, cfg.fileName);
    const result = await invoke('git_commit_and_push', {
      repoPath: cfg.repoPath, fileName: cfg.fileName,
      message: msg,
      remote: cfg.remote || 'origin',
      branch: cfg.branch || null,
    });
    setGitBaseline(payload);
    await refreshGitStatus();
    render();
    if (result.nothing_to_commit) {
      showToast('✅ 変更なし（Push 完了）');
    } else {
      showToast(`⬆️ Push 完了 (${result.sha || ''})`);
    }
  } catch (e) {
    showGitError('Push に失敗しました', e);
  } finally {
    gitBusy = false;
    render();
  }
}

// payload を tasks.json に書き出してコミット（push なし）。マージ後に使う。
async function writeAndCommit(cfg, payload, message) {
  const invoke = tauriInvoke();
  if (!invoke) return;
  const content = JSON.stringify(payload, null, 2);
  await invoke('git_write_file', {
    repoPath: cfg.repoPath, fileName: cfg.fileName, content,
  });
  await invoke('git_commit_only', {
    repoPath: cfg.repoPath, fileName: cfg.fileName, message,
  });
}

function emptyPayload() {
  return { version: 1, lists: [], todos: [], trash: [] };
}

// ── 3-way マージ ─────────────────────────────────────────
// 「意味のあるフィールド」だけを比較対象にする（exportedAt や内部フラグは除外）
const MEANINGFUL_FIELDS_TODO = [
  'text', 'completed', 'createdAt', 'listId', 'dueDate', 'startDate',
  'completedAt', 'folderPath', 'linkType', 'detail', 'parentId', 'recurrence',
];
const MEANINGFUL_FIELDS_LIST = ['name', 'createdAt', 'type'];

function recordEqual(a, b, fields) {
  if (!a && !b) return true;
  if (!a || !b) return false;
  for (const f of fields) {
    const av = JSON.stringify(a[f] ?? null);
    const bv = JSON.stringify(b[f] ?? null);
    if (av !== bv) return false;
  }
  return true;
}

// 2 つの payload が「リスト/タスク/ゴミ箱の内容として」実質的に同じかを判定
function payloadsEquivalent(a, b) {
  for (const { key, fields } of [
    { key: 'lists', fields: MEANINGFUL_FIELDS_LIST },
    { key: 'todos', fields: MEANINGFUL_FIELDS_TODO },
    { key: 'trash', fields: MEANINGFUL_FIELDS_TODO },
  ]) {
    const aArr = a[key] || [], bArr = b[key] || [];
    if (aArr.length !== bArr.length) return false;
    const aMap = new Map(aArr.map(x => [x.id, x]));
    for (const bItem of bArr) {
      const aItem = aMap.get(bItem.id);
      if (!aItem) return false;
      if (!recordEqual(aItem, bItem, fields)) return false;
    }
  }
  return true;
}

function mergeThreeWay(base, ours, theirs) {
  const merged = { version: 1, lists: [], todos: [], trash: [] };
  const conflicts = [];

  const categories = [
    { key: 'lists', fields: MEANINGFUL_FIELDS_LIST },
    { key: 'todos', fields: MEANINGFUL_FIELDS_TODO },
    { key: 'trash', fields: MEANINGFUL_FIELDS_TODO },
  ];
  for (const { key, fields } of categories) {
    const baseMap   = new Map((base[key]   || []).map(x => [x.id, x]));
    const oursMap   = new Map((ours[key]   || []).map(x => [x.id, x]));
    const theirsMap = new Map((theirs[key] || []).map(x => [x.id, x]));
    const allIds = new Set([...baseMap.keys(), ...oursMap.keys(), ...theirsMap.keys()]);

    for (const id of allIds) {
      const b = baseMap.get(id);
      const o = oursMap.get(id);
      const t = theirsMap.get(id);
      const oursChanged   = !recordEqual(b, o, fields);
      const theirsChanged = !recordEqual(b, t, fields);

      // (1) どちらも変更なし
      if (!oursChanged && !theirsChanged) {
        if (o || t) merged[key].push({ ...(o || t) });
        continue;
      }
      // (2) ours のみ変更
      if (oursChanged && !theirsChanged) {
        if (o) merged[key].push({ ...o });
        continue;
      }
      // (3) theirs のみ変更
      if (!oursChanged && theirsChanged) {
        if (t) merged[key].push({ ...t });
        continue;
      }
      // (4) 両方変更（または削除）
      // 4-a: 両方とも同じ結果に変更 → 残す
      if (o && t && recordEqual(o, t, fields)) {
        merged[key].push({ ...o });
        continue;
      }
      // 4-b: 競合
      conflicts.push({ kind: key, id, base: b || null, ours: o || null, theirs: t || null });
    }
  }
  return { merged, conflicts };
}

// マージ確定: resolutions に従って merged を構築
function buildMergedWithResolutions(autoMerged, conflicts, resolutions) {
  const result = {
    version: 1,
    lists: autoMerged.lists.map(x => ({ ...x })),
    todos: autoMerged.todos.map(x => ({ ...x })),
    trash: autoMerged.trash.map(x => ({ ...x })),
  };
  for (let i = 0; i < conflicts.length; i++) {
    const c = conflicts[i];
    const r = resolutions[i];
    const choice = r?.choice || 'ours';
    const arr = result[c.kind];
    if (choice === 'ours') {
      if (c.ours) arr.push({ ...c.ours });
    } else if (choice === 'theirs') {
      if (c.theirs) arr.push({ ...c.theirs });
    } else if (choice === 'both') {
      // 両方残す（theirs に新 ID を割り当てて衝突回避）
      if (c.ours)   arr.push({ ...c.ours });
      if (c.theirs) arr.push({ ...c.theirs, id: crypto.randomUUID(), parentId: undefined });
    }
  }
  return result;
}

async function gitMergeConfirm() {
  if (!gitMergeData) return;
  const cfg = getGitConfig();
  if (!cfg.enabled || !cfg.repoPath) return;
  const invoke = tauriInvoke();
  if (!invoke) return;
  gitBusy = true;
  try {
    const merged = buildMergedWithResolutions(
      gitMergeData.mergedAuto, gitMergeData.conflicts, gitMergeData.resolutions
    );
    applyExportPayloadInPlace(merged);
    // ローカルブランチをリモートに ff-only で追従させてから commit
    // （これをしないと枝分かれして Push が拒否される）
    try {
      await invoke('git_pull_ff_only', {
        repoPath: cfg.repoPath,
        remote: cfg.remote || 'origin',
        branch: cfg.branch || null,
      });
    } catch (ffErr) {
      console.warn('git pull --ff-only before manual merge commit failed:', ffErr);
    }
    await writeAndCommit(cfg, merged, 'Merge remote (manual resolution)');
    setGitBaseline(merged);
    setGitStash(null);
    gitMergeData = null;
    closeModal();
    await refreshGitStatus();
    render();
    showToast('🔀 マージを確定しました。Push して反映してください');
  } catch (e) {
    showGitError('マージ確定に失敗しました', e);
  } finally {
    gitBusy = false;
    render();
  }
}

function gitMergeCancel() {
  // 退避していたローカル変更をそのまま残す（stash には残しておく）
  gitMergeData = null;
  closeModal();
}

function gitMergePick(index, choice) {
  if (!gitMergeData || !gitMergeData.resolutions[index]) return;
  gitMergeData.resolutions[index].choice = choice;
  render();
}
function gitMergeBulk(choice) {
  if (!gitMergeData) return;
  gitMergeData.resolutions.forEach(r => { r.choice = choice; });
  render();
}

// ── Drag visual helpers ─────────────────────────────────
function setDragOver(el) {
  if (dragOverEl === el) return;
  if (dragOverEl) dragOverEl.classList.remove('drag-over');
  dragOverEl = el;
  if (dragOverEl) dragOverEl.classList.add('drag-over');
}
function clearDragOver() { setDragOver(null); }

// ── Event handlers ─────────────────────────────────────
document.addEventListener('click', e => {
  // メモポップアップを外クリックで閉じる
  if (memoPopupId && !e.target.closest('#memo-popup') && !e.target.closest('[data-a="memo-show"]')) {
    memoPopupId = null; memoPopupPos = null; render(); return;
  }

  // デスクトップ: 日付入力エリアクリック時にfocusしてピッカーを開く（focusinで処理）
  if (!isMobile()) {
    const wrap = e.target.closest('.edit-date-wrap');
    if (wrap) {
      const dateInput = wrap.querySelector('input[type="date"]');
      if (dateInput) dateInput.focus();
      return;
    }
  }

  const el = e.target.closest('[data-a]');
  const a  = el?.dataset.a;
  const id = e.target.closest('[data-id]')?.dataset.id;
  if (!a) return;
  switch (a) {
    case 'dark':         toggleDark(); break;
    case 'toggle-sidebar': sidebarOpen = !sidebarOpen; render(); break;
    case 'toggle':       e.stopPropagation(); toggleTodo(id); break;
    case 'sort-by-date': e.stopPropagation(); sortByDate(); break;
    case 'toggle-all-collapse': {
      e.stopPropagation();
      const mainsWithSubs = currentTodos().filter(t => !t.parentId && hasSubs(t.id));
      if (mainsWithSubs.length === 0) break;
      const allCollapsed = mainsWithSubs.every(t => collapsedIds.has(t.id));
      if (allCollapsed) {
        // 全て展開
        mainsWithSubs.forEach(t => collapsedIds.delete(t.id));
      } else {
        // 全て折り畳む
        mainsWithSubs.forEach(t => collapsedIds.add(t.id));
      }
      render(); break;
    }
    case 'to-trash':     e.stopPropagation(); moveToTrash(id); break;
    case 'toggle-trash': toggleTrash(); break;
    case 'toggle-completed-section': showCompletedSection = !showCompletedSection; render(); break;
    case 'save':         commitEdit(); break;
    case 'cancel':       cancelEdit(); break;
    case 'clr-date':     editDue = ''; skipFocusRestore = true; render(); break;
    case 'clr-start-date': editStartDate = ''; skipFocusRestore = true; render(); break;
    case 'clr-folder':   editFolderPath = ''; skipFocusRestore = true; render(); break;
    case 'toggle-collapse': {
      e.stopPropagation();
      if (collapsedIds.has(id)) collapsedIds.delete(id); else collapsedIds.add(id);
      render(); break;
    }
    case 'toggle-done-subs': {
      e.stopPropagation();
      if (expandedDoneSubs.has(id)) expandedDoneSubs.delete(id); else expandedDoneSubs.add(id);
      render(); break;
    }
    case 'promote-to-main': promoteSubToMain(id); break;
    case 'memo-show': {
      e.stopPropagation();
      if (memoPopupId === id) {
        memoPopupId = null; memoPopupPos = null;
      } else {
        memoPopupId = id;
        const btn = e.target.closest('[data-a="memo-show"]');
        if (btn) { const r = btn.getBoundingClientRect(); memoPopupPos = { top: r.top, bottom: r.bottom, left: r.left, right: r.right }; }
      }
      render(); break;
    }
    case 'toggle-link-type': e.stopPropagation(); editLinkType = editLinkType === 'folder' ? 'url' : 'folder'; render(); break;
    case 'folder-open': {
      e.stopPropagation();
      const ft = todos.find(x => x.id === id);
      if (!ft?.folderPath) break;

      // URL：ブラウザで開く
      if (ft.linkType === 'url') {
        let url = ft.folderPath;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        // Tauri環境：既定ブラウザで開く
        if (window.__TAURI__?.core?.invoke) {
          window.__TAURI__.core.invoke('open_folder', { path: url })
            .then(() => showToast('🔗 URLを開きました'))
            .catch(() => showToast('⚠️ URLを開けませんでした'));
          break;
        }
        // Web環境：window.open で開く
        window.open(url, '_blank');
        showToast('🔗 URLを開きました');
        break;
      }

      // Tauri環境：invoke経由でフォルダを開く
      if (window.__TAURI__?.core?.invoke) {
        window.__TAURI__.core.invoke('open_folder', { path: ft.folderPath })
          .then(() => showToast('📁 フォルダを開きました'))
          .catch(() => {
            showToast('📋 パスをクリップボードにコピーしました');
            navigator.clipboard.writeText(ft.folderPath).catch(() => {});
          });
        break;
      }

      // Web環境：クリップボードコピー
      navigator.clipboard.writeText(ft.folderPath)
        .then(() => showToast('📋 パスをクリップボードにコピーしました'))
        .catch(() => {
          const ta = document.createElement('textarea');
          ta.value = ft.folderPath;
          ta.style.cssText = 'position:fixed;left:-9999px;opacity:0;';
          document.body.appendChild(ta); ta.focus(); ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(ok ? '📋 パスをクリップボードにコピーしました' : 'コピーできませんでした');
        });
      break;
    }
    case 'restore':      restoreFromTrash(id); break;
    case 'del-trash':    deleteFromTrash(id); break;
    case 'empty':        emptyTrash(); break;
    case 'select-list':  selectList(id); break;
    case 'del-list':     e.stopPropagation(); handleDeleteList(id); break;
    case 'toggle-list-type': e.stopPropagation(); editingListType = editingListType === 'todo' ? 'memo' : 'todo'; render(); break;
    case 'start-add-list': addingList = true; newListName = ''; render(); break;
    case 'open-export':     openExportModal(); break;
    case 'open-import':     openImportModal(); break;
    case 'open-git-config': openGitConfigModal(); break;
    case 'open-notify-config': {
      modalMode = 'notify-config';
      render();
      break;
    }
    case 'notify-request': {
      requestNotifyPermission().then(result => {
        if (result === 'granted') {
          // 直後にバッジを反映
          _lastBadgeCount = -1; // 強制再送
          updateBadge(computeBadgeCount());
          showToast('✅ 通知が有効になりました');
        } else if (result === 'denied') {
          showToast('通知がブロックされました');
        }
        render();
      });
      break;
    }
    case 'notify-refresh': {
      _lastBadgeCount = -1;
      updateBadge(computeBadgeCount());
      showToast(`🔔 バッジ更新（件数: ${computeBadgeCount()}）`);
      render();
      break;
    }
    case 'git-pull':        gitPull(); break;
    case 'git-push':        gitPush(); break;
    case 'git-config-test': gitConfigTest(); break;
    case 'git-baseline-reset': {
      if (confirm('ベースラインをリセットしますか？\n次回 Pull が「初回 Pull」として実行され、リモートの内容を取り込み直します。')) {
        localStorage.removeItem(GIT_KEYS.baseline);
        localStorage.removeItem(GIT_KEYS.stash);
        showToast('🔄 ベースラインをリセットしました');
        render();
      }
      break;
    }
    case 'git-config-save': {
      if (!gitConfigDraft) break;
      syncGitConfigDraftFromInputs();
      gitConfigSave();
      break;
    }
    case 'git-merge-confirm': gitMergeConfirm(); break;
    case 'git-merge-cancel':  gitMergeCancel(); break;
    case 'git-merge-pick': {
      const idx = parseInt(el.dataset.idx, 10);
      const choice = el.dataset.choice;
      gitMergePick(idx, choice);
      break;
    }
    case 'git-merge-bulk': {
      const choice = el.dataset.choice;
      gitMergeBulk(choice);
      break;
    }
    case 'modal-close':     closeModal(); break;
    case 'modal-overlay':
      // モーダル内から始めたドラッグが枠外で離れた場合は閉じない
      if (e.target.classList.contains('modal-overlay') && _mouseDownOnModalOverlay) closeModal();
      _mouseDownOnModalOverlay = false;
      break;
    case 'modal-toggle-all': toggleModalAll(); break;
    case 'modal-toggle':    toggleModalItem(id); break;
    case 'modal-confirm':   if (modalMode === 'export') executeExport(); else executeImport(); break;
    case 'toggle-list-trash': toggleListTrash(); break;
    case 'toggle-stats': toggleListStats(); break;
    case 'toggle-list-expand': toggleListExpand(); break;
    case 'close-move-popup': closeMovePopup(); break;
    case 'close-ctx-menu': ctxMenuTodoId = null; ctxMenuListId = null; ctxMenuPos = null; ctxSubmenuOpen = false; render(); break;
    case 'ctx-edit': { const tid = id; ctxMenuTodoId = null; ctxMenuPos = null; ctxSubmenuOpen = false; startEdit(tid); break; }
    case 'ctx-delete': { const tid = id; ctxMenuTodoId = null; ctxMenuPos = null; ctxSubmenuOpen = false; moveToTrash(tid); break; }
    case 'ctx-rename-list': { const lid = id; ctxMenuListId = null; ctxMenuPos = null; startRenameList(lid); break; }
    case 'ctx-delete-list': { const lid = id; ctxMenuListId = null; ctxMenuPos = null; handleDeleteList(lid); break; }
    case 'ctx-toggle-submenu': { e.stopPropagation(); ctxSubmenuOpen = !ctxSubmenuOpen; render(); break; }
    case 'ctx-submenu-body': { e.stopPropagation(); break; }
    case 'ctx-set-parent': {
      e.stopPropagation();
      const tid = el.dataset.id;
      const pid = el.dataset.parentId;
      const t = todos.find(x => x.id === tid);
      if (t && pid && pid !== t.parentId) {
        t.parentId = pid;
        // 配列内で「親の最後のサブの直後」に移動
        const dragIdx = todos.findIndex(x => x.id === tid);
        if (dragIdx >= 0) {
          const moved = todos.splice(dragIdx, 1)[0];
          const lastSubIdx = todos.reduce((acc, x, i) => x.parentId === pid ? i : acc, -1);
          const parentIdx = todos.findIndex(x => x.id === pid);
          const insertAt = (lastSubIdx >= 0 ? lastSubIdx : parentIdx) + 1;
          todos.splice(insertAt, 0, moved);
        }
        if (collapsedIds.has(pid)) collapsedIds.delete(pid);
        save();
      }
      ctxMenuTodoId = null; ctxMenuPos = null; ctxSubmenuOpen = false;
      render();
      break;
    }
    case 'ctx-promote': {
      const tid = id;
      ctxMenuTodoId = null; ctxMenuPos = null; ctxSubmenuOpen = false;
      promoteSubToMain(tid);
      break;
    }
    case 'add-sub-init': {
      e.stopPropagation();
      subInputParentId = id;
      render();
      requestAnimationFrame(() => {
        const inp = document.getElementById('todo-inp') || document.getElementById('todo-inp-mobile');
        if (inp) inp.focus();
      });
      break;
    }
    case 'cancel-sub-input': {
      e.stopPropagation();
      subInputParentId = null;
      render();
      break;
    }
    case 'set-task-filter': {
      const f = el.dataset.filter;
      taskFilter = (taskFilter === f && f !== 'all') ? 'all' : f;
      render();
      break;
    }
    case 'move-popup-body': break; // ポップアップ内クリックは何もしない（オーバーレイへの伝播防止）
    case 'move-to-list': moveToList(el.dataset.todoId, el.dataset.listId); break;
    case 'restore-list':      { const idx = e.target.closest('[data-idx]')?.dataset.idx; if (idx != null) restoreList(+idx); break; }
    case 'del-list-permanent': { e.stopPropagation(); const idx = e.target.closest('[data-idx]')?.dataset.idx; if (idx != null) deleteListPermanently(+idx); break; }
    case 'empty-list-trash':  emptyListTrash(); break;
  }
});

// モバイル向けダブルタップ検出
(function() {
  const DOUBLE_TAP_MS = 300;
  let lastTap = 0, lastTarget = null;
  document.addEventListener('touchend', e => {
    if (!('ontouchstart' in window)) return;
    const now = Date.now();
    const target = e.target;
    const elapsed = now - lastTap;
    const sameTarget = lastTarget && (
      target === lastTarget || target.closest('.todo-item') === lastTarget.closest('.todo-item') ||
      target.closest('.list-nav-item') === lastTarget.closest('.list-nav-item')
    );
    if (elapsed < DOUBLE_TAP_MS && sameTarget) {
      // ダブルタップ確定
      const todoItem = target.closest('.todo-item');
      if (todoItem && !target.closest('.cb-wrap') && !target.closest('.item-del') && !target.closest('.drag-handle')) {
        e.preventDefault();
        if (editId !== todoItem.dataset.id) startEdit(todoItem.dataset.id);
        lastTap = 0; lastTarget = null;
        return;
      }
      const listItem = target.closest('.list-nav-item[data-a="select-list"]');
      if (listItem && !target.closest('button') && !target.closest('input')) {
        e.preventDefault();
        if (editingListId !== listItem.dataset.id) startRenameList(listItem.dataset.id);
        lastTap = 0; lastTarget = null;
        return;
      }
    }
    lastTap = now;
    lastTarget = target;
  });
})();

document.addEventListener('change', e => {

    const val = e.target.value;
    editDue = val;
    if (!val || !isIOS) { skipFocusRestore = true; render(); }
  }

    editStartDate = val;
    if (!val || !isIOS) { skipFocusRestore = true; render(); }
  }
  if (e.target.id === 'ei-recurrence-type') {
    const v = e.target.value;
    if (v) {
      editRecurrence = { type: v };

      if (v === 'monthly') editRecurrence.day     = 1; // デフォルト1日
    } else {
      editRecurrence = {};
    }
    skipFocusRestore = true;
    render();
  }
  if (e.target.id === 'ei-recurrence-weekday') {
    editRecurrence.weekday = parseInt(e.target.value, 10);
  }
  if (e.target.id === 'ei-recurrence-day') {

document.addEventListener('input', e => {

  if (e.target.id === 'ei-detail')       editDetail       = e.target.value;
  if (e.target.id === 'ei-folder')       editFolderPath   = e.target.value;

  if (e.target.id === 'list-add-inp')    newListName      = e.target.value;
});

document.addEventListener('keydown', e => {
  if (modalMode && e.key === 'Escape') { closeModal(); return; }
  if (e.target.id === 'ei-text') {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitEdit(); }
    if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
  }
  if (e.target.id === 'list-rename-inp') {
    if (e.key === 'Enter')  { e.preventDefault(); commitRenameList(); }
    if (e.key === 'Escape') { editingListId = null; render(); }
  }
  if (e.target.id === 'list-add-inp') {
    if (e.key === 'Enter')  { e.preventDefault(); commitAddList(); }
    if (e.key === 'Escape') { addingList = false; newListName = ''; render(); }
  }
  // textarea追加欄: Enter=追加, Shift+Enter=改行, Escape=サブモード解除
  if (e.target.id === 'todo-inp' || e.target.id === 'todo-inp-mobile') {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addTodo(e.target.closest('form')); }
    if (e.key === 'Escape' && subInputParentId) { e.preventDefault(); subInputParentId = null; render(); }
  }
});

// focusout：日付確定・リスト名確定をまとめて処理
document.addEventListener('focusout', e => {
  if (e.target.id === 'ei-date') {
    const val = e.target.value;
    if (val && val !== e.target.dataset.prev) {
      const dueBefore = editDue;
      setTimeout(() => {
        if (editId && editDue === dueBefore) { editDue = val; render(); }
      }, 150);
    }
  }
  if (e.target.id === 'ei-start-date') {
    const val = e.target.value;
    if (val && val !== e.target.dataset.prev) {
      const before = editStartDate;
      setTimeout(() => {
        if (editId && editStartDate === before) { editStartDate = val; render(); }
      }, 150);
    }
  }
  if (e.target.id === 'list-rename-inp' && editingListId) {
    // メモリスト切替クリック時はコミットしない
    const related = e.relatedTarget;
    if (related && related.closest('[data-a="toggle-list-type"]')) return;
    commitRenameList();
  }
  if (e.target.id === 'list-add-inp' && addingList) {
    if (newListName.trim()) commitAddList();
    else { addingList = false; newListName = ''; render(); }
  }
});

// ── Drag & Drop (デスクトップのみ) ─────────────────────
document.addEventListener('dragstart', e => {
  // ドラッグハンドルからのみ並び替えを許可
  const handle = e.target.closest('.drag-handle, .list-drag-handle');
  if (!handle) { e.preventDefault(); return; }
  const todo  = handle.closest('.todo-item');
  const trsh  = handle.closest('.trash-item');
  const lnav  = handle.closest('.list-nav-item[data-a="select-list"]');
  if (todo)  { dragTodoId  = todo.dataset.id;  e.dataTransfer.effectAllowed = 'move'; setTimeout(() => todo.classList.add('dragging'),  0); }
  else if (trsh)  { dragTrashId = trsh.dataset.id;  e.dataTransfer.effectAllowed = 'move'; setTimeout(() => trsh.classList.add('dragging'), 0); }
  else if (lnav) { dragListId = lnav.dataset.id; e.dataTransfer.effectAllowed = 'move'; setTimeout(() => lnav.classList.add('dragging'), 0); }
});

document.addEventListener('dragend', () => {
  document.querySelectorAll('.dragging,.drop-as-sub').forEach(el => el.classList.remove('dragging', 'drop-as-sub'));
  clearDragOver();
  dragTodoId = null; dragTrashId = null; dragListId = null;
});

document.addEventListener('dragover', e => {
  if (!dragTodoId && !dragTrashId && !dragListId) return;
  if (dragListId) {
    const overList = e.target.closest('.list-nav-item[data-a="select-list"]');
    if (overList && overList.dataset.id !== dragListId) { e.preventDefault(); setDragOver(overList); }
    else clearDragOver();
    return;
  }
  if (dragTodoId) {
    const overTodo   = e.target.closest('.todo-item');
    const overTBtn   = e.target.closest('#trash-btn');
    const overTPanel = e.target.closest('#trash-panel');
    const overList   = e.target.closest('.list-nav-item[data-a="select-list"]');
    if (overTodo || overTBtn || overTPanel || overList) e.preventDefault();
    // サブ化候補ハイライトの管理
    document.querySelectorAll('.drop-as-sub').forEach(el => el.classList.remove('drop-as-sub'));
    if      (overTodo && overTodo.dataset.id !== dragTodoId) {
      setDragOver(overTodo);
      const rect = overTodo.getBoundingClientRect();
      const isSubZone = (e.clientY - rect.top) > rect.height * 0.6;
      const tId = overTodo.dataset.id;
      const tTodo = todos.find(x => x.id === tId);
      if (isSubZone && tTodo && !tTodo.parentId && !hasSubs(dragTodoId)) {
        overTodo.classList.add('drop-as-sub');
      }
    }
    else if (overList && overList.dataset.id !== selectedListId) setDragOver(overList);
    else if (overTBtn)   setDragOver(overTBtn);
    else if (overTPanel) setDragOver(overTPanel);
    else clearDragOver();
    return;
  }
  if (dragTrashId) {
    // ゴミ箱ドラッグ中の特別なドロップターゲットは廃止（個別の復元ボタンで対応）
    clearDragOver();
  }
});

document.addEventListener('drop', e => {
  e.preventDefault();
  clearDragOver();
  if (dragListId) {
    const onList = e.target.closest('.list-nav-item[data-a="select-list"]');
    if (onList && onList.dataset.id !== dragListId) reorderList(dragListId, onList.dataset.id);
    dragListId = null; return;
  }
  if (dragTodoId) {
    const onTodo  = e.target.closest('.todo-item');
    const onTrash = e.target.closest('#trash-btn, #trash-panel');
    const onList  = e.target.closest('.list-nav-item[data-a="select-list"]');
    if (onList && onList.dataset.id !== selectedListId) {
      moveToList(dragTodoId, onList.dataset.id);
    } else if (onTodo && onTodo.dataset.id !== dragTodoId) {
      // ドロップ位置でメイン化/サブ化を判定
      const rect = onTodo.getBoundingClientRect();
      const isSubZone = (e.clientY - rect.top) > rect.height * 0.6;
      const targetId = onTodo.dataset.id;
      const targetTodo = todos.find(x => x.id === targetId);
      const dragTodo = todos.find(x => x.id === dragTodoId);
      if (isSubZone && targetTodo && dragTodo && !targetTodo.parentId && !hasSubs(dragTodoId)) {
        // ターゲットのサブにする（サブ有りメインはサブ化拒否）
        dragTodo.parentId = targetId;
        // 配列内で「親の最後のサブの直後」に移動して、表示順が常に末尾になるよう固定
        const dragIdx = todos.findIndex(x => x.id === dragTodoId);
        if (dragIdx >= 0) {
          todos.splice(dragIdx, 1);
          const lastSubIdx = todos.reduce((acc, x, i) => x.parentId === targetId ? i : acc, -1);
          const parentIdx = todos.findIndex(x => x.id === targetId);
          const insertAt = (lastSubIdx >= 0 ? lastSubIdx : parentIdx) + 1;
          todos.splice(insertAt, 0, dragTodo);
        }
        if (collapsedIds.has(targetId)) collapsedIds.delete(targetId); // 展開
        save(); render();
      } else {
        // 並び替え or メイン化（サブをメイン領域へ）
        if (dragTodo?.parentId && !isSubZone && !targetTodo?.parentId) {
          // ターゲットがメインで、上半分にドロップされた場合はメイン化
          dragTodo.parentId = undefined;
        }
        reorder(dragTodoId, targetId);
      }
    }
    else if (onTrash) moveToTrash(dragTodoId);
    dragSubZoneTargetId = null;
    document.querySelectorAll('.drop-as-sub').forEach(el => el.classList.remove('drop-as-sub'));
    dragTodoId = null; return;
  }
  if (dragTrashId) {
    // フィルターボタンへのドロップ復元は廃止（個別の復元ボタンで対応）
    dragTrashId = null;
  }
});

let fileDragTimer = null;
document.addEventListener('dragover', e => {
  if (dragTodoId || dragTrashId) return;
  if (!e.dataTransfer || !e.dataTransfer.types.includes('Files')) return;
  e.preventDefault();
  if (!fileDragOver) { fileDragOver = true; render(); }
  clearTimeout(fileDragTimer);
  fileDragTimer = setTimeout(() => { if (fileDragOver) { fileDragOver = false; render(); } }, 150);
});
document.addEventListener('drop', e => {

  if (fileDragOver) { fileDragOver = false; render(); }
  const files = e.dataTransfer?.files;
  if (!files || files.length === 0) return;
